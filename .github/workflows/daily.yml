# Daily refresh of every market: prices, scoring of due claims, new claims, page data.
# Scheduled runs only start once this file is on the default branch.
# Optional secret ANTHROPIC_API_KEY: with it the cards are phrased by Claude; without it, by fixed templates.
name: daily
on:
  schedule:
    - cron: "17 22 * * 1-5"   # after the US close, Monday to Friday
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r research/news_impact/requirements.txt anthropic pydantic
      - run: python -m research.supply_chain.auto
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true      # a failed step is in the log; what did run is still committed
      - run: |
          git config user.name "trendvest-daily"
          git config user.email "actions@users.noreply.github.com"
          git add research/supply_chain
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push
