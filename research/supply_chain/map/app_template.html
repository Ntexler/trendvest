<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three linked screens (market -> company -> case) under one stepper that always says
   where you are. Cards on a tinted page, one accent colour, green/red only for changes. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --raised: #eef1f4; --fg: #15202a; --muted: #5d6b78; --line: #d5dbe1;
  --accent: #0a6f82; --accent-soft: #dbeff2; --good: #1b7f45; --bad: #c0392b; --warn: #946200;
  --font: "Heebo", "Segoe UI", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1419; --surface: #172028; --raised: #1f2a33; --fg: #e8eef2; --muted: #9cabb8; --line: #33424e;
  --accent: #5ac8da; --accent-soft: #133a43; --good: #63d48f; --bad: #ff8372; --warn: #e6b54a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1419; --surface: #172028; --raised: #1f2a33; --fg: #e8eef2; --muted: #9cabb8; --line: #33424e;
  --accent: #5ac8da; --accent-soft: #133a43; --good: #63d48f; --bad: #ff8372; --warn: #e6b54a; color-scheme: dark }
* { box-sizing: border-box } [hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.55; direction: rtl;
  padding-block: 16px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; width: 100%; min-width: 0 }
.wrap > *, .grid > *, .head > *, .id > * { min-width: 0; max-width: 100% }
h1, .intro { overflow-wrap: anywhere }
button, input { font-family: inherit } :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
a { color: var(--accent) } p { margin: 0 }
.num { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums }
.neg { color: var(--bad) } .pos { color: var(--good) } .muted { color: var(--muted) } .lbl { font-size: 12px; color: var(--muted) }
/* top bar + stepper */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }
.bar > * { max-width: 100% }
.steps { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0 }
.steps button { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px 6px 12px; cursor: pointer; max-width: 100%; min-width: 0; text-align: start; overflow: hidden; white-space: nowrap; text-overflow: ellipsis }
.steps button i { font: 500 12px var(--mono); font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; flex: 0 0 auto }
.steps button[aria-current=true] { color: var(--fg); border-color: var(--accent); font-weight: 500 }
.steps button[aria-current=true] i { background: var(--accent); color: var(--surface) }
.tools { display: flex; gap: 8px; align-items: center; min-width: 0 }
input[type=search] { font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 180px; min-width: 0 }
.btn { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer }
.btn.primary { color: var(--surface); background: var(--accent); border-color: var(--accent); font-weight: 500 }
.here { font-size: 13px; color: var(--muted); background: var(--raised); border-radius: 8px; padding: 8px 12px }
h1 { font-size: 28px; font-weight: 700; margin: 0; line-height: 1.2 } h2 { font-size: 16px; font-weight: 700; margin: 0 }
.intro { font-size: 16px; max-width: 70ch }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; display: flex; flex-direction: column; gap: 12px }
.head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap }
.grid { display: grid; gap: 16px } .kpis { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px }
.kpi b { font-size: 22px; font-weight: 700 }
.split { grid-template-columns: minmax(0, 1fr) } @media (min-width: 900px) { .split { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr) } }
/* chain */
.chain { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px }
.stage { flex: 1 0 142px; background: var(--raised); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; position: relative }
.stage .n { font: 500 11px var(--mono); color: var(--muted) } .stage b { font-size: 14.5px; line-height: 1.25 } .stage p { font-size: 12.5px; color: var(--muted); min-height: 3.1em }
.stage .t { font-size: 11.5px; color: var(--accent); border-top: 1px solid var(--line); padding-top: 6px }
.co { font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; cursor: pointer; text-align: start; width: 100% }
.co:hover, .rowbtn:hover { border-color: var(--accent); color: var(--accent) }
.more { font-size: 13px; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; align-self: flex-start }
table { border-collapse: collapse; width: 100%; font-size: 13.5px } th, td { text-align: start; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
th { color: var(--muted); font-weight: 500; font-size: 12px } td.r, th.r { text-align: end } .scroll { overflow-x: auto; min-width: 0 }
.rowbtn { font-size: inherit; font-weight: 500; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-align: start }
.tag { font-size: 11.5px; border-radius: 10px; padding: 1px 8px; background: var(--raised); color: var(--muted); white-space: nowrap }
.tag.good { color: var(--good) } .tag.bad { color: var(--bad) } .tag.warn { color: var(--warn) }
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column } ul.items li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; overflow-wrap: anywhere }
ul.items li:first-child { border-top: 0; padding-top: 0 }
.raw { font-size: 12px; color: var(--muted); direction: ltr; text-align: right; unicode-bidi: plaintext }
/* company */
.id { display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: flex-end; justify-content: space-between }
.hero { font-size: 32px; font-weight: 700; line-height: 1.1 }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px 20px }
.stats div { display: flex; flex-direction: column } .stats b { font-size: 17px; font-weight: 500 }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { font-size: 14px; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; white-space: nowrap }
.tabs button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.chip[aria-pressed=true] { color: var(--fg); border-color: var(--fg) } .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block }
.chart svg { display: block; width: 100%; height: auto; direction: ltr } .chart text { font: 400 10.5px var(--mono); fill: var(--muted) }
.chart .mk { cursor: pointer } .chart .mk:hover circle[fill^='var'], .chart .mk:hover rect[transform] { stroke: var(--fg); stroke-width: 2 }
.side { background: var(--raised); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px }
.mini { background: var(--raised); border-radius: 10px; overflow-x: auto } .mini svg { display: block; width: 100%; min-width: 500px; height: auto; direction: ltr }
.mini text { font: 500 11.5px var(--font); fill: var(--fg) } .mini .cap { font-size: 11px; fill: var(--muted) }
.mini rect { fill: var(--surface); stroke: var(--line) } .mini .me rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2 }
.mini g[data-go] { cursor: pointer } .mini g[data-go]:hover rect { stroke: var(--accent) } .mini path { fill: none; stroke: var(--muted); opacity: .6 }
.qbars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; height: 90px; direction: ltr; max-width: 340px }
.qbars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; height: 100%; font: 400 11px var(--mono); color: var(--muted) }
.qbars i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .85 }
/* case */
.range { position: relative; height: 22px; direction: ltr; min-width: 160px } .range .axis { position: absolute; inset: 10px 0 auto; height: 2px; background: var(--line) }
.range .band { position: absolute; top: 6px; height: 10px; background: var(--accent); opacity: .3; border-radius: 5px } .range .zero { position: absolute; top: 2px; bottom: 2px; width: 1px; background: var(--muted) }
.range .dot { position: absolute; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-left: -6px }
.range .this { position: absolute; top: 1px; width: 2px; height: 20px; background: var(--fg) }
.two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) }
ul.plain { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px }
.bottom { font-size: 16px; font-weight: 500; max-width: 70ch }
.guess { display: flex; flex-wrap: wrap; gap: 8px }
.foot { font-size: 12px; color: var(--muted); max-width: 90ch }
</style>

<div class="wrap">
  <div class="bar">
    <div class="steps" id="steps" aria-label="איפה אני"></div>
    <div class="tools"><input type="search" id="q" list="names" placeholder="חיפוש חברה" autocomplete="off" aria-label="חיפוש חברה"><datalist id="names"></datalist>
      <button class="btn" id="theme" type="button"></button></div>
  </div>
  <p class="here" id="here"></p>
  <main id="screen" class="wrap" style="max-width:none"></main>
  <p class="foot" id="foot"></p>
</div>

<script>
const D = /*__DATA__*/null, M = D.market;
const L = { roles: { hit: "נפגעו ישירות", down1: "לקוחות שתלויים בנפגעות", up1: "ספקים שהנפגעות הן לקוח גדול שלהם", down2: "לקוחות של הלקוחות", up2: "ספקים של הספקים", rival: "מתחרות", control: "לא קשורות" },
  role1: { hit: "נפגעה ישירות", down1: "לקוחה תלויה", up1: "ספקית", down2: "לקוחה של לקוחה", up2: "ספקית של ספקית", rival: "מתחרה", control: "לא קשורה" },
  effect: { shortens: ["מקצר", "good"], adds: ["מוסיף קיבולת", "good"], delays: ["מעכב", "warn"], blocks: ["חוסם", "bad"], other: ["שינוי בעלות", ""] },
  type: { regulation: "רגולציה", technology: "טכנולוגיה", move: "מהלך עסקי" },
  country: { US: "ארה\"ב", JP: "יפן", TW: "טייוואן", KR: "קוריאה", DE: "גרמניה", NL: "הולנד", IL: "ישראל", CN: "סין", FR: "צרפת", CH: "שווייץ" } };
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = v => !v ? "–" : (v < 0 ? "-" : "") + "$" + (Math.abs(v) >= 1e12 ? (Math.abs(v) / 1e12).toFixed(2) + "T" : Math.abs(v) >= 1e9 ? (Math.abs(v) / 1e9).toFixed(Math.abs(v) >= 1e11 ? 0 : 1) + "B" : (Math.abs(v) / 1e6).toFixed(0) + "M");
const f1 = (v, m = 1, s = "") => v == null ? "–" : (v * m).toFixed(1) + s;
const pct = (v, d = 1) => v == null || isNaN(v) ? "–" : `<span class="num ${v < 0 ? "neg" : v > 0 ? "pos" : ""}">${v > 0 ? "+" : ""}${v.toFixed(d)}%</span>`;
const src = k => k && D.sources[k] ? ` <a class="lbl" href="${esc(D.sources[k][1])}" target="_blank" rel="noopener">${esc(D.sources[k][0])}</a>` : "";
const tag = (t, c) => `<span class="tag ${c || ""}">${esc(t)}</span>`;
const co = id => `<button class="rowbtn" data-co="${id}">${esc(byId[id].name)}</button>`;
const stage = t => D.stages[t].title;
D.edges.forEach(e => { e.material = e.crit || Number(e.share) >= 10; });
const byWeight = (a, b) => (b.material - a.material) || (Number(b.share || 0) - Number(a.share || 0));
const chg = (a, k) => { const v = a.filter(x => x != null); if (v.length < 2) return null; const s = v[Math.max(0, v.length - 1 - k)]; return (v[v.length - 1] / s - 1) * 100; };
const histOf = id => M.history.find(h => h[5] === id) || (M.event_he[id] ? ["", ...M.event_he[id]] : null);
let S = { screen: "market", co: "TSMC", ev: "HUALIEN2024", tab: "overview", range: 156, layers: { events: true, changes: false, market: true }, pick: null, practice: false, guessed: null, more: {} };

function spark(a, w = 90, h = 26) { const v = a.filter(x => x != null); if (v.length < 2) return ""; const lo = Math.min(...v), hi = Math.max(...v);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="direction:ltr" aria-hidden="true"><polyline fill="none" stroke="${v[v.length - 1] >= v[0] ? "var(--good)" : "var(--bad)"}" stroke-width="1.5" points="${
    v.map((x, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 3 - (x - lo) / (hi - lo || 1) * (h - 6)).toFixed(1)}`).join(" ")}"/></svg>`; }

/* ================= screen 1: market ================= */
function market() {
  const stages = D.tiers.map((t, i) => { const ns = D.nodes.filter(n => n.tier === t).sort((a, b) => (b.info.revenueUSD || 0) - (a.info.revenueUSD || 0));
    return `<div class="stage"><span class="n">שלב ${i + 1}</span><b>${esc(stage(t))}</b><p>${esc(M.plain[t])}</p>
      ${ns.slice(0, 3).map(n => `<button class="co" data-co="${n.id}">${esc(n.name)}</button>`).join("")}
      <span class="lbl">${ns.length > 3 ? `ועוד ${ns.length - 3} חברות` : "&nbsp;"}</span><span class="t">${esc(M.time[t])}</span></div>`; }).join("");
  const all = [...D.nodes].sort((a, b) => (b.info.revenueUSD || 0) - (a.info.revenueUSD || 0)), shown = S.more.cos ? all : all.slice(0, 8);
  const rows = shown.map(n => `<tr><td>${co(n.id)}</td><td class="muted">${esc(stage(n.tier))}</td><td class="r num">${usd(n.info.revenueUSD)}</td>
    <td class="r">${pct(chg(n.px, 52), 0)}</td><td class="r">${spark(n.px.slice(-52))}</td></tr>`).join("");
  const ch = [...M.changes].sort((a, b) => b[5].localeCompare(a[5])), chShown = S.more.ch ? ch : ch.slice(0, 4);
  const hist = [...M.history].reverse().slice(0, S.more.hist ? 99 : 4);
  $("screen").innerHTML = `
    <div><h1>${esc(M.name)}</h1><p class="intro" style="margin-top:6px">${esc(M.intro)}</p></div>
    <div class="grid kpis">${M.kpis.map(k => `<div class="kpi"><span class="lbl">${esc(k[0])}</span><b class="num" style="direction:rtl">${esc(k[1])}</b>${src(k[2])}</div>`).join("")}</div>
    <div class="card"><div class="head"><h2>${esc(M.chain_title)}</h2><span class="lbl">הסחורה עוברת מימין לשמאל. בתחתית כל שלב: כמה זמן הוא לוקח.</span></div><div class="chain">${stages}</div></div>
    <div class="grid split">
      <div class="card"><div class="head"><h2>החברות הגדולות</h2><span class="lbl">לחיצה על חברה פותחת את העמוד שלה</span></div>
        <div class="scroll"><table><thead><tr><th>חברה</th><th>שלב</th><th class="r">הכנסות בשנה</th><th class="r">המניה בשנה האחרונה</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        ${S.more.cos ? "" : `<button class="more" data-more="cos">כל ${all.length} החברות</button>`}</div>
      <div class="card"><h2>מה משתנה עכשיו</h2><ul class="items">${chShown.map(c => `<li><div>${tag(...L.effect[c[1]])} <b>${esc(c[3])}</b></div>
        <span class="muted">${esc(c[4])}</span><span class="lbl">${L.type[c[0]]} · ${esc(stage(c[2]))} · <span class="num">${esc(c[5])}</span>${src(c[7])}</span></li>`).join("")}</ul>
        ${S.more.ch ? "" : `<button class="more" data-more="ch">עוד ${ch.length - 4}</button>`}</div>
    </div>
    <div class="card"><div class="head"><h2>מה היה</h2><span class="lbl">אירועים שזעזעו את השוק. באירוע עם תיק אפשר לראות מי נפגע וכמה.</span></div>
      <ul class="items">${hist.map(h => `<li><div><span class="num muted">${esc(h[0])}</span> <b>${esc(h[1])}</b> ${h[5] ? `<button class="btn" data-case="${h[5]}" style="margin-inline-start:8px">פתיחת תיק</button>` : ""}</div>
        <span class="muted">${esc(h[2])}${src(h[4])}</span></li>`).join("")}</ul>${S.more.hist ? "" : `<button class="more" data-more="hist">עוד ${M.history.length - 4}</button>`}</div>`;
}

/* ================= screen 2: company ================= */
function chart(n) { const W = 760, PH = 210, RH = n.pulse.rev ? 64 : 0, X0 = 44, X1 = W - 12, top = 14, k = Math.min(S.range, D.dates.length);
  const dates = D.dates.slice(-k), t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length - 1]), X = d => X0 + (Date.parse(d) - t0) / (t1 - t0) * (X1 - X0);
  const norm = a => { const v = a.slice(-k), b = v.find(x => x != null); return v.map(x => x == null ? null : (x / b - 1) * 100); };
  const me = norm(n.px), mk = S.layers.market ? norm(D.mkt) : [], vals = [...me, ...mk].filter(x => x != null), lo = Math.min(...vals, 0), hi = Math.max(...vals, 0);
  const Y = v => top + (hi - v) / (hi - lo || 1) * (PH - top - 8);
  const line = (a, st) => `<polyline fill="none" ${st} points="${a.map((v, i) => v == null ? "" : `${X(dates[i]).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ")}"/>`;
  const ticks = [lo, lo + (hi - lo) / 2, hi].map(v => `<line x1="${X0}" x2="${X1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${X0 - 6}" y="${Y(v) + 3}" text-anchor="end">${v > 0 ? "+" : ""}${v.toFixed(0)}%</text>`).join("");
  const years = [...new Set(dates.map(d => d.slice(0, 4)))].slice(1).map(y => `<text x="${X(y + "-01-01")}" y="${PH + RH + 14}" text-anchor="middle">${y}</text><line x1="${X(y + "-01-01")}" x2="${X(y + "-01-01")}" y1="${top}" y2="${PH + RH}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("");
  let marks = "";
  const inR = d => Date.parse(d) >= t0 && Date.parse(d) <= t1;
  if (S.layers.events) marks += D.events.filter(e => inR(e.ts)).map(e => `<g class="mk" data-pick="ev:${e.id}"><rect x="${X(e.ts) - 9}" y="${top - 8}" width="18" height="${PH - top + 8}" fill="transparent"/><line x1="${X(e.ts)}" x2="${X(e.ts)}" y1="${top}" y2="${PH}" stroke="var(--warn)" stroke-dasharray="3 3"/><circle cx="${X(e.ts)}" cy="${top}" r="6" fill="var(--warn)"/></g>`).join("");
  if (S.layers.changes) marks += M.changes.map((c, i) => ({ c, i, d: (c[5].length === 4 ? c[5] + "-06" : c[5]) + "-15" })).filter(o => inR(o.d)).map(o =>
    `<g class="mk" data-pick="ch:${o.i}"><circle cx="${X(o.d)}" cy="${PH - 11}" r="13" fill="transparent" stroke="none"/><rect x="${X(o.d) - 5}" y="${PH - 16}" width="10" height="10" transform="rotate(45 ${X(o.d)} ${PH - 11})" fill="var(--accent)"/></g>`).join("");
  let rev = "";
  if (RH) { const r = n.pulse.rev.filter(x => inR(x[0])), mx = Math.max(...r.map(x => x[1])), bw = Math.max(3, (X1 - X0) / (r.length || 1) * 0.55);
    rev = r.map(x => `<rect x="${X(x[0]) - bw}" y="${PH + 6 + (1 - x[1] / mx) * (RH - 10)}" width="${bw}" height="${x[1] / mx * (RH - 10)}" fill="var(--accent)" opacity=".55"/>`).join("") +
      `<text x="${X0 - 6}" y="${PH + 16}" text-anchor="end">הכנסות</text>`; }

    ${mk.length ? line(mk, 'stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4"') : ""}${line(me, 'stroke="var(--accent)" stroke-width="2.2"')}${rev}${marks}</svg>`; }
function pickPanel(n) { if (!S.pick) return `<div class="side"><b>מה מסומן על הגרף</b><p class="muted">עיגול כתום הוא אירוע עבר. מעוין כחול הוא שינוי ברגולציה, בטכנולוגיה או מהלך עסקי. לחיצה על סימן מציגה כאן הסבר וקישור למקור.</p></div>`;
  const [k, id] = S.pick.split(":");

    return `<div class="side"><span class="lbl">אירוע · <span class="num">${e.ts.slice(0, 10)}</span></span><b>${esc(h ? h[1] : e.name)}</b><p>${esc(h ? h[2] : e.note)}</p>
      ${r ? `<p class="muted">${esc(n.name)} באירוע הזה: ${L.role1[r.w || r.role]}. אחרי 3 ימים ${pct(r.d3)}, אחרי 10 ימים ${pct(r.d10)}.</p>` : ""}

  const c = M.changes[Number(id)];
  return `<div class="side"><span class="lbl">${L.type[c[0]]} · <span class="num">${esc(c[5])}</span></span><div>${tag(...L.effect[c[1]])} <b>${esc(c[3])}</b></div><p>${esc(c[4])}</p>
    <p class="muted">השלב המושפע: ${esc(stage(c[2]))}. מצב: ${esc(c[6])}.</p><div>${src(c[7])}</div></div>`; }
function mini(n, sup, cus) { const cap = 5, A = sup.slice(0, cap), C = cus.slice(0, cap), rows = Math.max(A.length, C.length, 1), H = 44 + rows * 30, W = 540, bw = 146, bh = 22;
  const y = (i, k) => 34 + (rows - k) * 15 + i * 30, cy = H / 2 + 6, mx = (W - bw) / 2;
  const box = (x, yy, o, cls) => `<g ${o ? `data-go="${o.id}"` : ""} class="${cls || ""}"><rect x="${x}" y="${yy}" width="${bw}" height="${bh}" rx="6"/><text x="${x + bw / 2}" y="${yy + 15}" text-anchor="middle">${esc((o || n).name.slice(0, 19))}</text></g>`;
  const ln = (x1, y1, x2, y2, m) => `<path d="M${x1} ${y1}C${(x1 + x2) / 2} ${y1},${(x1 + x2) / 2} ${y2},${x2} ${y2}" stroke-width="${m ? 2.4 : 1}"/>`;
  return `<div class="mini"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ספקים ולקוחות"><text class="cap" x="${W - 10 - bw / 2}" y="18" text-anchor="middle" direction="rtl">מי מספק לה${sup.length > cap ? ` (${cap} מתוך ${sup.length})` : ""}</text>
    <text class="cap" x="${10 + bw / 2}" y="18" text-anchor="middle" direction="rtl">למי היא מוכרת${cus.length > cap ? ` (${cap} מתוך ${cus.length})` : ""}</text>
    ${A.map((e, i) => ln(W - 10 - bw, y(i, A.length) + bh / 2, mx + bw, cy, e.material)).join("")}${C.map((e, i) => ln(mx, cy, 10 + bw, y(i, C.length) + bh / 2, e.material)).join("")}
    ${A.map((e, i) => box(W - 10 - bw, y(i, A.length), byId[e.s])).join("")}${C.map((e, i) => box(10, y(i, C.length), byId[e.t])).join("")}${box(mx, cy - bh / 2, null, "me")}</svg></div>`; }
function newsItem(x) { return `<li>${x.he ? `<span>${esc(x.he)} ${tag("סיכום: בינה מלאכותית")}</span>` : x.s ? `<span class="raw" style="font-size:13.5px;color:var(--fg)">${esc(x.s)}</span><span class="lbl">תקציר המקור, באנגלית</span>` : ""}
  <span class="raw">${esc(x.t)}</span><span class="lbl">${esc(x.p)} · <span class="num">${esc(x.d)}</span> · <a href="${esc(x.u)}" target="_blank" rel="noopener">לידיעה המלאה</a></span></li>`; }
function company() { const n = byId[S.co], i = n.info, p = n.pulse || {};
  const sup = D.edges.filter(e => e.t === n.id).sort(byWeight), cus = D.edges.filter(e => e.s === n.id).sort(byWeight);
  const evs = D.events.filter(e => n.ev[e.id] && (n.ev[e.id].w || n.ev[e.id].role) !== "control");
  const y1 = chg(n.px, 52), last = n.px.filter(x => x != null).pop();
  const names = (es, f) => es.slice(0, 2).map(e => byId[f(e)].name).join(" ו-");
  const sentence = `${n.name} פועלת בשלב "${stage(n.tier)}": ${M.plain[n.tier].replace(/\.$/, "")}. ` + (cus.length ? `בין הלקוחות שלה: ${names(cus, e => e.t)}. ` : "") + (sup.length ? `בין הספקים שלה: ${names(sup, e => e.s)}.` : "");
  const link = (e, o) => `<li><div>${co(o)} ${e.material ? tag("קשר מהותי") : ""} ${e.share ? `<span class="num">${e.share}%</span> <span class="lbl">מהכנסות הספק</span>` : ""}</div>
    <span class="lbl">${esc(e.what)}${e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">מקור</a>` : ""}</span></li>`;
  const tabs = [["overview", "סקירה"], ["chain", `שרשרת (${sup.length + cus.length})`], ["money", "כספים"], ["news", `חדשות (${n.news.length})`], ["events", `אירועים (${evs.length})`]];
  const chartCard = `<div class="card"><div class="head"><h2>המניה לאורך זמן</h2><div class="chips">
      ${[[52, "שנה"], [156, "3 שנים"], [263, "5 שנים"]].map(r => `<button class="chip" data-range="${r[0]}" aria-pressed="${S.range === r[0]}">${r[1]}</button>`).join("")}</div></div>
    <div class="chips"><span class="lbl">שכבות:</span>

    <span class="lbl">הקו מראה בכמה אחוזים השתנה המחיר מתחילת התקופה. ${p.rev ? `העמודות למטה: הכנסות ${p.rev_unit ? "חודשיות" : "רבעוניות"}.` : ""}</span></div>`;
  let body = "";
  if (S.tab === "overview") body = `<div class="grid split">${chartCard}<div class="grid" style="align-content:start">${pickPanel(n)}
      <div class="card"><h2>מספרים עיקריים</h2><div class="stats"><div><span class="lbl">הכנסות בשנה</span><b class="num">${usd(i.revenueUSD)}</b></div><div><span class="lbl">רווח נקי</span><b class="num">${usd(i.netIncomeUSD)}</b></div>
        <div><span class="lbl">עובדים</span><b class="num">${i.fullTimeEmployees ? i.fullTimeEmployees.toLocaleString("en") : "–"}</b></div><div><span class="lbl">שווי שוק</span><b class="num">${usd(i.marketCapUSD)}</b></div>
        <div><span class="lbl">רווח גולמי</span><b class="num">${f1(i.grossMargins, 100, "%")}</b></div><div><span class="lbl">צמיחת הכנסות</span><b class="num">${f1(i.revenueGrowth, 100, "%")}</b></div></div></div></div></div>
    <div class="grid split"><div class="card"><div class="head"><h2>מי מספק לה ולמי היא מוכרת</h2><button class="more" data-tab="chain">לכל הקשרים</button></div>${sup.length + cus.length ? mini(n, sup, cus) : '<p class="muted">לא נמצאו קשרים מתועדים.</p>'}</div>
      <div class="card"><div class="head"><h2>חדשות אחרונות</h2><button class="more" data-tab="news">עוד ${Math.max(0, n.news.length - 2)}</button></div><ul class="items">${n.news.slice(0, 2).map(newsItem).join("") || '<li class="muted">אין ידיעות.</li>'}</ul></div></div>`;
  if (S.tab === "chain") body = `<div class="card">${sup.length + cus.length ? mini(n, sup, cus) : ""}<span class="lbl">קו עבה הוא קשר מהותי. לחיצה על חברה עוברת אליה.</span>
    <div class="two"><div><h2 style="margin-bottom:8px">למי היא מוכרת</h2><ul class="items">${cus.map(e => link(e, e.t)).join("") || '<li class="muted">לא נמצאו</li>'}</ul></div>
      <div><h2 style="margin-bottom:8px">מי מספק לה</h2><ul class="items">${sup.map(e => link(e, e.s)).join("") || '<li class="muted">לא נמצאו</li>'}</ul></div></div></div>`;
  if (S.tab === "money") { const kv = [["מכפיל רווח", f1(i.trailingPE)], ["רווח תפעולי", f1(i.operatingMargins, 100, "%")], ["ימי מלאי", p.inventory_days ? p.inventory_days.latest : "–"],
      ["התחייבויות רכש לספקים", p.purchase_obligation ? usd(p.purchase_obligation.value) : "–"], ["התחייבויות של לקוחות", p.remaining_performance_obligation ? usd(p.remaining_performance_obligation.value) : "–"], ["מקדמות מלקוחות", p.customer_prepayments ? usd(p.customer_prepayments.value) : "–"]];
    const s = p.seasonality, v = s && ["Q1", "Q2", "Q3", "Q4"].map(q => s[q]), lo = v && Math.min(...v, 90) - 4, hi = v && Math.max(...v, 110);
    body = `<div class="grid split"><div class="card"><h2>כספים</h2><div class="stats">${kv.map(x => `<div><span class="lbl">${x[0]}</span><b class="num">${x[1]}</b></div>`).join("")}</div>
        <span class="lbl">איך מזמינים בשלב הזה: ${esc(D.stages[n.tier].badge)}</span></div>

    <span class="lbl">תנועה חריגה: אחרי ניכוי התנועה של השוק המקומי באותם ימים.</span></div>`;

/* ================= screen 3: case ================= */
function caseScreen() { const e = D.events.find(x => x.id === S.ev), h = histOf(e.id), hide = S.practice && !S.guessed;
  const of = role => D.nodes.filter(n => n.ev[e.id] && (n.ev[e.id].w || n.ev[e.id].role) === role);
  const why = (n, role) => { if (role === "hit") return "המפעלים או האספקה שלה נפגעו ישירות";
    const x = role === "down1" ? D.edges.find(g => g.t === n.id && e.hit.includes(g.s) && g.crit) : D.edges.find(g => g.s === n.id && e.hit.includes(g.t) && Number(g.share) >= 10);
    return !x ? "" : role === "down1" ? `קונה מ-${byId[x.s].name}: ${x.what}` : `${x.share}% מההכנסות שלה מגיעים מ-${byId[x.t].name}`; };
  const groups = ["hit", "down1", "up1"].map(role => { const ns = of(role).sort((a, b) => a.ev[e.id].d3 - b.ev[e.id].d3); if (!ns.length) return "";
    return `<tr><th colspan="4" style="padding-top:14px;color:var(--fg);font-size:13.5px">${L.roles[role]} (${ns.length})</th></tr>` + ns.map(n => { const r = n.ev[e.id];
      return `<tr><td>${co(n.id)}</td><td class="muted">${esc(why(n, role))}</td><td class="r">${hide ? "?" : pct(r.d3)}</td><td class="r">${hide ? "?" : pct(r.d10)}</td></tr>`; }).join(""); }).join("");
  const lo = -12, hi = 6, P = v => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * 100;
  const base = ["hit", "down1", "up1"].filter(r => D.base[r] && D.base[r].n >= 2).map(r => { const b = D.base[r], t = b.by_event[e.id];
    return `<tr><td>${L.roles[r]}</td><td class="r">ירדו ב-<b>${b.fell}</b> מתוך <b>${b.n}</b> אירועים</td><td class="r">${pct(b.mean)}</td>
      <td><div class="range"><div class="axis"></div><div class="band" style="left:${P(b.min)}%;width:${P(b.max) - P(b.min)}%"></div><div class="zero" style="left:${P(0)}%"></div><div class="dot" style="left:${P(b.mean)}%"></div>${t != null && !hide ? `<div class="this" style="left:${P(t)}%"></div>` : ""}</div></td>

    ${S.guessed ? `<p><b>${(S.guessed === "down") === (mine < -0.5) || (S.guessed === "flat" && Math.abs(mine) <= 0.5) || (S.guessed === "up" && mine > 0.5) ? "קלעת." : "לא הפעם."}</b> בממוצע הן זזו ${pct(mine)}. הפירוט המלא מופיע עכשיו למטה.</p>`
      : `<div class="guess"><button class="btn" data-guess="down">ירדו</button><button class="btn" data-guess="flat">כמעט לא זזו</button><button class="btn" data-guess="up">עלו</button></div>`}</div>` : "";
  $("screen").innerHTML = `<div class="card"><div class="head"><div><span class="lbl">תיק אירוע · <span class="num">${e.ts.slice(0, 10)}</span> · ${esc(e.loc)}</span><h1>${esc(h ? h[1] : e.name)}</h1></div>
      <button class="btn" data-practice>${S.practice ? "יציאה ממצב תרגול" : "מצב תרגול: להסתיר את התוצאות"}</button></div>
      <p class="intro">${esc(h ? h[2] : e.note)}</p><span class="lbl"><a href="${esc(e.url)}" target="_blank" rel="noopener">למקור</a>${e.confounder ? ` · באותם ימים קרה גם: ${esc(e.confounder)}` : ""}</span></div>
    ${guess}
    <div class="card"><div class="head"><h2>מי חשוף, ולמה</h2><span class="lbl">התנועה היא אחרי ניכוי השוק המקומי</span></div><div class="scroll"><table><thead><tr><th>חברה</th><th>למה היא חשופה</th><th class="r">אחרי 3 ימים</th><th class="r">אחרי 10 ימים</th></tr></thead><tbody>${groups}</tbody></table></div></div>
    <div class="card"><div class="head"><h2>מה קרה במקרים דומים בעבר</h2><span class="lbl">תנועה ממוצעת אחרי 3 ימים. הפס: הטווח בין האירועים. ${hide ? "" : "הקו השחור: האירוע הזה."}</span></div>
      <div class="scroll"><table><thead><tr><th>קבוצה</th><th class="r">כמה פעמים ירדו</th><th class="r">ממוצע</th><th style="min-width:180px">טווח (מ-12%- עד 6%+)</th><th></th></tr></thead><tbody>${base}</tbody></table></div></div>

      <div class="card"><h2>נגד: למה להיזהר</h2><ul class="plain"><li>המדגם קטן: ${d1 ? d1.n : "מעט"} אירועים בלבד, ואירוע אחד יכול להטות את הממוצע.</li>

    <div class="card"><h2>מה יפריך את זה</h2><ul class="plain"><li>הודעה של החברה שהייצור חזר לפעול בתוך יום או יומיים.</li><li>ללקוח יש ספק חלופי או מלאי שמספיק לכמה חודשים.</li><li>באירועים הבאים שנאסוף, הלקוחות התלויים לא יורדים יותר משאר השוק.</li></ul></div>
    <div class="card"><h2>שורה תחתונה</h2><p class="bottom">${d1 ? `באירועים דומים, מניות של לקוחות תלויים ירדו בממוצע ${Math.abs(d1.mean)}% בשלושה ימים, ב-${d1.fell} מתוך ${d1.n} מקרים.` : "אין מספיק מקרים דומים כדי לומר משהו."}</p>
      <span class="lbl">זה נתון היסטורי ממדגם קטן, לא תחזית ולא המלצה. היומן שיבדוק תחזיות לאורך זמן עוד לא התחיל.</span></div>`;
}

/* ================= shell ================= */
const HERE = { market: "המסך הזה מסביר את השוק: מה השלבים, מי החברות, מה משתנה ומה היה. לחיצה על חברה עוברת לעמוד שלה.",
  company: "המסך הזה מרכז חברה אחת: המניה לאורך זמן עם שכבות שאפשר להדליק, הספקים והלקוחות, כספים וחדשות. לחיצה על סימן בגרף מסבירה אותו.",
  case: "המסך הזה חוקר אירוע אחד: מי היה חשוף ולמה, מה קרה למניות, ומה קרה במקרים דומים בעבר." };
function render() { const e = D.events.find(x => x.id === S.ev), h = histOf(S.ev);
  $("steps").innerHTML = [["market", "השוק: " + M.name], ["company", "חברה: " + byId[S.co].name], ["case", "תיק: " + (h ? h[1] : e.name)]].map((s, i) =>
    `<button data-screen="${s[0]}" aria-current="${S.screen === s[0]}"><i>${i + 1}</i>${esc(s[1])}</button>`).join("");
  $("here").textContent = HERE[S.screen];
  ({ market, company, case: caseScreen })[S.screen]();
  if (location.hash.slice(1) !== S.screen) history.replaceState(null, "", "#" + S.screen); }
function go(patch, top = true) { Object.assign(S, patch); render(); if (top) scrollTo({ top: 0 }); }
document.addEventListener("click", ev => { const t = ev.target.closest("[data-screen],[data-co],[data-go],[data-case],[data-tab],[data-range],[data-layer],[data-pick],[data-more],[data-practice],[data-guess]"); if (!t) return;
  const d = t.dataset;
  if (d.screen) go({ screen: d.screen }); else if (d.co || d.go) go({ screen: "company", co: d.co || d.go, tab: "overview", pick: null });
  else if (d.case) go({ screen: "case", ev: d.case, practice: false, guessed: null }); else if (d.tab) go({ tab: d.tab }, false);
  else if (d.range) go({ range: Number(d.range) }, false); else if (d.layer) { S.layers[d.layer] = !S.layers[d.layer]; render(); }
  else if (d.pick) go({ pick: d.pick }, false); else if (d.more) { S.more[d.more] = true; render(); }
  else if ("practice" in d) go({ practice: !S.practice, guessed: null }, false); else if (d.guess) go({ guessed: d.guess }, false); });
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (HERE[v] && v !== S.screen) go({ screen: v }); });
D.nodes.forEach(n => { const o = document.createElement("option"); o.value = n.name; o.label = n.ticker; $("names").appendChild(o); });
$("q").addEventListener("change", e => { const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const n = D.nodes.find(n => n.name.toLowerCase() === v || n.ticker.toLowerCase() === v) || D.nodes.find(n => n.name.toLowerCase().includes(v));
  if (n) { e.target.value = ""; go({ screen: "company", co: n.id, tab: "overview", pick: null }); } });
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const label = () => { $("theme").textContent = isDark() ? "תצוגה בהירה" : "תצוגה כהה"; };
try { const t = localStorage.getItem("market-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("theme").addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("market-theme", root.dataset.theme); } catch (e) {} label(); });
label();
$("foot").textContent = `סקיצה. נבדק לאחרונה: ${M.checked}. המספרים על חברות מגיעים מ-Yahoo Finance ומדיווחים לרשויות. כלי מחקר ולמידה אישי, לא המלצת השקעה.`;
if (HERE[location.hash.slice(1)]) S.screen = location.hash.slice(1);
render();
</script>
