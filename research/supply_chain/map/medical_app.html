const src = k => k && D.sources[k] ? ` <a class="lbl" href="${esc(D.sources[k][1])}" target="_blank" rel="noopener">${esc(D.sources[k][0])}</a>` : "";
const tag = (t, c) => `<span class="tag ${c || ""}">${esc(t)}</span>`;

const chg = (a, k) => { const v = a.filter(x => x != null); if (v.length < 2) return null; const s = v[Math.max(0, v.length - 1 - k)]; return (v[v.length - 1] / s - 1) * 100; };
const histOf = id => M.history.find(h => h[5] === id) || (M.event_he[id] ? ["", ...M.event_he[id]] : null);
let S = { screen: "market", co: "TSMC", ev: "HUALIEN2024", tab: "overview", range: 156, layers: { events: true, changes: false, market: true }, pick: null, practice: false, guessed: null, more: {} };

function spark(a, w = 90, h = 26) { const v = a.filter(x => x != null); if (v.length < 2) return ""; const lo = Math.min(...v), hi = Math.max(...v);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="direction:ltr" aria-hidden="true"><polyline fill="none" stroke="${v[v.length - 1] >= v[0] ? "var(--good)" : "var(--bad)"}" stroke-width="1.5" points="${
    v.map((x, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 3 - (x - lo) / (hi - lo || 1) * (h - 6)).toFixed(1)}`).join(" ")}"/></svg>`; }

/* ================= screen 1: market ================= */

/* ================= screen 2: company ================= */
function chart(n) { const W = 760, PH = 210, RH = n.pulse.rev ? 64 : 0, X0 = 44, X1 = W - 12, top = 14, k = Math.min(S.range, D.dates.length);
  const dates = D.dates.slice(-k), t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length - 1]), X = d => X0 + (Date.parse(d) - t0) / (t1 - t0) * (X1 - X0);
  const norm = a => { const v = a.slice(-k), b = v.find(x => x != null); return v.map(x => x == null ? null : (x / b - 1) * 100); };
  const me = norm(n.px), mk = S.layers.market ? norm(D.mkt) : [], vals = [...me, ...mk].filter(x => x != null), lo = Math.min(...vals, 0), hi = Math.max(...vals, 0);
  const Y = v => top + (hi - v) / (hi - lo || 1) * (PH - top - 8);
  const line = (a, st) => `<polyline fill="none" ${st} points="${a.map((v, i) => v == null ? "" : `${X(dates[i]).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ")}"/>`;
  const ticks = [lo, lo + (hi - lo) / 2, hi].map(v => `<line x1="${X0}" x2="${X1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${X0 - 6}" y="${Y(v) + 3}" text-anchor="end">${v > 0 ? "+" : ""}${v.toFixed(0)}%</text>`).join("");
  const years = [...new Set(dates.map(d => d.slice(0, 4)))].slice(1).map(y => `<text x="${X(y + "-01-01")}" y="${PH + RH + 14}" text-anchor="middle">${y}</text><line x1="${X(y + "-01-01")}" x2="${X(y + "-01-01")}" y1="${top}" y2="${PH + RH}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("");
  let marks = "";
  const inR = d => Date.parse(d) >= t0 && Date.parse(d) <= t1;
  if (S.layers.events) marks += D.events.filter(e => inR(e.ts)).map(e => `<g class="mk" data-pick="ev:${e.id}"><rect x="${X(e.ts) - 9}" y="${top - 8}" width="18" height="${PH - top + 8}" fill="transparent"/><line x1="${X(e.ts)}" x2="${X(e.ts)}" y1="${top}" y2="${PH}" stroke="var(--warn)" stroke-dasharray="3 3"/><circle cx="${X(e.ts)}" cy="${top}" r="6" fill="var(--warn)"/></g>`).join("");
  if (S.layers.changes) marks += M.changes.map((c, i) => ({ c, i, d: (c[5].length === 4 ? c[5] + "-06" : c[5]) + "-15" })).filter(o => inR(o.d)).map(o =>
    `<g class="mk" data-pick="ch:${o.i}"><circle cx="${X(o.d)}" cy="${PH - 11}" r="13" fill="transparent" stroke="none"/><rect x="${X(o.d) - 5}" y="${PH - 16}" width="10" height="10" transform="rotate(45 ${X(o.d)} ${PH - 11})" fill="var(--accent)"/></g>`).join("");
  let rev = "";
  if (RH) { const r = n.pulse.rev.filter(x => inR(x[0])), mx = Math.max(...r.map(x => x[1])), bw = Math.max(3, (X1 - X0) / (r.length || 1) * 0.55);
    rev = r.map(x => `<rect x="${X(x[0]) - bw}" y="${PH + 6 + (1 - x[1] / mx) * (RH - 10)}" width="${bw}" height="${x[1] / mx * (RH - 10)}" fill="var(--accent)" opacity=".55"/>`).join("") +
      `<text x="${X0 - 6}" y="${PH + 16}" text-anchor="end">הכנסות</text>`; }
  return `<svg viewBox="0 0 ${W} ${PH + RH + 20}" role="img" aria-label="שינוי במחיר המניה של ${esc(n.name)} לאורך זמן">${ticks}${years}
    ${mk.length ? line(mk, 'stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4"') : ""}${line(me, 'stroke="var(--accent)" stroke-width="2.2"')}${rev}${marks}</svg>`; }
function pickPanel(n) { if (!S.pick) return `<div class="side"><b>מה מסומן על הגרף</b><p class="muted">עיגול כתום הוא אירוע עבר. מעוין כחול הוא שינוי ברגולציה, בטכנולוגיה או מהלך עסקי. לחיצה על סימן מציגה כאן הסבר וקישור למקור.</p></div>`;
  const [k, id] = S.pick.split(":");
  if (k === "ev") { const e = D.events.find(x => x.id === id), h = histOf(id), r = n.ev[id];

  const c = M.changes[Number(id)];

function mini(n, sup, cus) { const cap = 5, A = sup.slice(0, cap), C = cus.slice(0, cap), rows = Math.max(A.length, C.length, 1), H = 44 + rows * 30, W = 540, bw = 146, bh = 22;

  const box = (x, yy, o, cls) => `<g ${o ? `data-go="${o.id}"` : ""} class="${cls || ""}"><rect x="${x}" y="${yy}" width="${bw}" height="${bh}" rx="6"/><text x="${x + bw / 2}" y="${yy + 15}" text-anchor="middle">${esc((o || n).name.slice(0, 19))}</text></g>`;
  const ln = (x1, y1, x2, y2, m) => `<path d="M${x1} ${y1}C${(x1 + x2) / 2} ${y1},${(x1 + x2) / 2} ${y2},${x2} ${y2}" stroke-width="${m ? 2.4 : 1}"/>`;
  return `<div class="mini"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ספקים ולקוחות"><text class="cap" x="${W - 10 - bw / 2}" y="18" text-anchor="middle" direction="rtl">מי מספק לה${sup.length > cap ? ` (${cap} מתוך ${sup.length})` : ""}</text>
    <text class="cap" x="${10 + bw / 2}" y="18" text-anchor="middle" direction="rtl">למי היא מוכרת${cus.length > cap ? ` (${cap} מתוך ${cus.length})` : ""}</text>
    ${A.map((e, i) => ln(W - 10 - bw, y(i, A.length) + bh / 2, mx + bw, cy, e.material)).join("")}${C.map((e, i) => ln(mx, cy, 10 + bw, y(i, C.length) + bh / 2, e.material)).join("")}
    ${A.map((e, i) => box(W - 10 - bw, y(i, A.length), byId[e.s])).join("")}${C.map((e, i) => box(10, y(i, C.length), byId[e.t])).join("")}${box(mx, cy - bh / 2, null, "me")}</svg></div>`; }
function newsItem(x) { return `<li>${x.he ? `<span>${esc(x.he)} ${tag("סיכום: בינה מלאכותית")}</span>` : x.s ? `<span class="raw" style="font-size:13.5px;color:var(--fg)">${esc(x.s)}</span><span class="lbl">תקציר המקור, באנגלית</span>` : ""}
  <span class="raw">${esc(x.t)}</span><span class="lbl">${esc(x.p)} · <span class="num">${esc(x.d)}</span> · <a href="${esc(x.u)}" target="_blank" rel="noopener">לידיעה המלאה</a></span></li>`; }
function company() { const n = byId[S.co], i = n.info, p = n.pulse || {};

  const tabs = [["overview", "סקירה"], ["chain", `שרשרת (${sup.length + cus.length})`], ["money", "כספים"], ["news", `חדשות (${n.news.length})`], ["events", `אירועים (${evs.length})`]];
  const chartCard = `<div class="card"><div class="head"><h2>המניה לאורך זמן</h2><div class="chips">

        <span class="lbl">איך מזמינים בשלב הזה: ${esc(D.stages[n.tier].badge)}</span></div>
      <div class="card"><h2>עונתיות לפי רבעון</h2>${v ? `<div class="qbars">${v.map((x, k) => `<div><span>${x.toFixed(0)}</span><i style="height:${Math.max(6, (x - lo) / (hi - lo) * 100)}%"></i><span>Q${k + 1}</span></div>`).join("")}</div><span class="lbl">100 הוא רבעון רגיל.</span>` : '<p class="muted">אין נתונים רבעוניים ממקור חינמי לחברה הזאת.</p>'}</div></div>`; }
  if (S.tab === "news") body = `<div class="card"><span class="lbl">בכל ידיעה: סיכום, מתחתיו הכותרת המקורית כלשונה, ואחריה המקור, התאריך וקישור.</span><ul class="items">${n.news.map(newsItem).join("") || '<li class="muted">אין ידיעות.</li>'}</ul></div>`;
  if (S.tab === "events") body = `<div class="card"><div class="scroll"><table><thead><tr><th>אירוע</th><th>התפקיד שלה</th><th class="r">אחרי 3 ימים</th><th class="r">אחרי 10 ימים</th><th></th></tr></thead><tbody>${
    evs.map(e => { const r = n.ev[e.id], h = histOf(e.id); return `<tr><td>${esc(h ? h[1] : e.name)} <span class="lbl num">${e.ts.slice(0, 4)}</span></td><td>${L.role1[r.w || r.role]}</td><td class="r">${pct(r.d3)}</td><td class="r">${pct(r.d10)}</td><td class="r"><button class="btn" data-case="${e.id}">תיק</button></td></tr>`; }).join("")}</tbody></table></div>
    <span class="lbl">תנועה חריגה: אחרי ניכוי התנועה של השוק המקומי באותם ימים.</span></div>`;
  $("screen").innerHTML = `<div class="card"><div class="id"><div><span class="lbl">${esc(stage(n.tier))} · ${L.country[n.country] || n.country} · <span class="num">${esc(n.ticker)}</span></span><h1>${esc(n.name)}</h1></div>
      <div><span class="lbl">מחיר המניה (${esc(i.currency || "")})</span><div class="hero num">${last != null ? last.toLocaleString("en") : "–"}</div><span>${pct(y1)} <span class="lbl">בשנה האחרונה</span></span></div></div>
      <p class="intro" style="font-size:15px">${esc(sentence)}</p></div>
    <div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" data-tab="${t[0]}" aria-selected="${S.tab === t[0]}">${t[1]}</button>`).join("")}</div>${body}`;
}

/* ================= screen 3: case ================= */
function caseScreen() { const e = D.events.find(x => x.id === S.ev), h = histOf(e.id), hide = S.practice && !S.guessed;
  const of = role => D.nodes.filter(n => n.ev[e.id] && (n.ev[e.id].w || n.ev[e.id].role) === role);
  const why = (n, role) => { if (role === "hit") return "המפעלים או האספקה שלה נפגעו ישירות";
    const x = role === "down1" ? D.edges.find(g => g.t === n.id && e.hit.includes(g.s) && g.crit) : D.edges.find(g => g.s === n.id && e.hit.includes(g.t) && Number(g.share) >= 10);
    return !x ? "" : role === "down1" ? `קונה מ-${byId[x.s].name}: ${x.what}` : `${x.share}% מההכנסות שלה מגיעים מ-${byId[x.t].name}`; };
  const groups = ["hit", "down1", "up1"].map(role => { const ns = of(role).sort((a, b) => a.ev[e.id].d3 - b.ev[e.id].d3); if (!ns.length) return "";
    return `<tr><th colspan="4" style="padding-top:14px;color:var(--fg);font-size:13.5px">${L.roles[role]} (${ns.length})</th></tr>` + ns.map(n => { const r = n.ev[e.id];
      return `<tr><td>${co(n.id)}</td><td class="muted">${esc(why(n, role))}</td><td class="r">${hide ? "?" : pct(r.d3)}</td><td class="r">${hide ? "?" : pct(r.d10)}</td></tr>`; }).join(""); }).join("");
  const lo = -12, hi = 6, P = v => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * 100;
  const base = ["hit", "down1", "up1"].filter(r => D.base[r] && D.base[r].n >= 2).map(r => { const b = D.base[r], t = b.by_event[e.id];
    return `<tr><td>${L.roles[r]}</td><td class="r">ירדו ב-<b>${b.fell}</b> מתוך <b>${b.n}</b> אירועים</td><td class="r">${pct(b.mean)}</td>
      <td><div class="range"><div class="axis"></div><div class="band" style="left:${P(b.min)}%;width:${P(b.max) - P(b.min)}%"></div><div class="zero" style="left:${P(0)}%"></div><div class="dot" style="left:${P(b.mean)}%"></div>${t != null && !hide ? `<div class="this" style="left:${P(t)}%"></div>` : ""}</div></td>
      <td class="r lbl">${b.n < 5 ? "מדגם קטן מאוד" : "מדגם קטן"}</td></tr>`; }).join("");
  const d1 = D.base.down1, hb = D.base.hit, mine = d1 && d1.by_event[e.id];
  const guess = S.practice ? `<div class="card" style="border-color:var(--accent)"><h2>מצב תרגול: נחש לפני שרואים</h2><p>יום האירוע הוא <span class="num">${e.ts.slice(0, 10)}</span>. מה לדעתך קרה למניות של הלקוחות התלויים בשלושת הימים שאחריו?</p>
    ${S.guessed ? `<p><b>${(S.guessed === "down") === (mine < -0.5) || (S.guessed === "flat" && Math.abs(mine) <= 0.5) || (S.guessed === "up" && mine > 0.5) ? "קלעת." : "לא הפעם."}</b> בממוצע הן זזו ${pct(mine)}. הפירוט המלא מופיע עכשיו למטה.</p>`
      : `<div class="guess"><button class="btn" data-guess="down">ירדו</button><button class="btn" data-guess="flat">כמעט לא זזו</button><button class="btn" data-guess="up">עלו</button></div>`}</div>` : "";
  $("screen").innerHTML = `<div class="card"><div class="head"><div><span class="lbl">תיק אירוע · <span class="num">${e.ts.slice(0, 10)}</span> · ${esc(e.loc)}</span><h1>${esc(h ? h[1] : e.name)}</h1></div>
      <button class="btn" data-practice>${S.practice ? "יציאה ממצב תרגול" : "מצב תרגול: להסתיר את התוצאות"}</button></div>
      <p class="intro">${esc(h ? h[2] : e.note)}</p><span class="lbl"><a href="${esc(e.url)}" target="_blank" rel="noopener">למקור</a>${e.confounder ? ` · באותם ימים קרה גם: ${esc(e.confounder)}` : ""}</span></div>
    ${guess}
    <div class="card"><div class="head"><h2>מי חשוף, ולמה</h2><span class="lbl">התנועה היא אחרי ניכוי השוק המקומי</span></div><div class="scroll"><table><thead><tr><th>חברה</th><th>למה היא חשופה</th><th class="r">אחרי 3 ימים</th><th class="r">אחרי 10 ימים</th></tr></thead><tbody>${groups}</tbody></table></div></div>
    <div class="card"><div class="head"><h2>מה קרה במקרים דומים בעבר</h2><span class="lbl">תנועה ממוצעת אחרי 3 ימים. הפס: הטווח בין האירועים. ${hide ? "" : "הקו השחור: האירוע הזה."}</span></div>
      <div class="scroll"><table><thead><tr><th>קבוצה</th><th class="r">כמה פעמים ירדו</th><th class="r">ממוצע</th><th style="min-width:180px">טווח (מ-12%- עד 6%+)</th><th></th></tr></thead><tbody>${base}</tbody></table></div></div>
    <div class="two"><div class="card"><h2>בעד: למה לצפות שזה יחזור</h2><ul class="plain">
        ${hb ? `<li>הנפגעות הישירות ירדו ב-${hb.fell} מתוך ${hb.n} אירועים, בממוצע ${hb.mean}%.</li>` : ""}${d1 ? `<li>הלקוחות התלויים ירדו ב-${d1.fell} מתוך ${d1.n} אירועים, בממוצע ${d1.mean}%.</li><li>אצל הלקוחות הירידה לא תוקנה עד היום העשירי (${d1.d10}% בממוצע).</li>` : ""}</ul></div>
      <div class="card"><h2>נגד: למה להיזהר</h2><ul class="plain"><li>המדגם קטן: ${d1 ? d1.n : "מעט"} אירועים בלבד, ואירוע אחד יכול להטות את הממוצע.</li>
        <li>ההגדרה של "לקוח תלוי" נקבעה אחרי שנראו התוצאות הראשונות.</li>${hb ? `<li>אצל הנפגעות הישירות רוב הירידה נמחקת: אחרי 10 ימים הממוצע הוא ${hb.d10}%.</li>` : ""}${e.confounder ? `<li>באירוע הזה קרה במקביל: ${esc(e.confounder)}.</li>` : ""}</ul></div></div>
    <div class="card"><h2>מה יפריך את זה</h2><ul class="plain"><li>הודעה של החברה שהייצור חזר לפעול בתוך יום או יומיים.</li><li>ללקוח יש ספק חלופי או מלאי שמספיק לכמה חודשים.</li><li>באירועים הבאים שנאסוף, הלקוחות התלויים לא יורדים יותר משאר השוק.</li></ul></div>
    <div class="card"><h2>שורה תחתונה</h2><p class="bottom">${d1 ? `באירועים דומים, מניות של לקוחות תלויים ירדו בממוצע ${Math.abs(d1.mean)}% בשלושה ימים, ב-${d1.fell} מתוך ${d1.n} מקרים.` : "אין מספיק מקרים דומים כדי לומר משהו."}</p>
      <span class="lbl">זה נתון היסטורי ממדגם קטן, לא תחזית ולא המלצה. היומן שיבדוק תחזיות לאורך זמן עוד לא התחיל.</span></div>`;
}

/* ================= shell ================= */
const HERE = { market: "המסך הזה מסביר את השוק: מה השלבים, מי החברות, מה משתנה ומה היה. לחיצה על חברה עוברת לעמוד שלה.",
  company: "המסך הזה מרכז חברה אחת: המניה לאורך זמן עם שכבות שאפשר להדליק, הספקים והלקוחות, כספים וחדשות. לחיצה על סימן בגרף מסבירה אותו.",
  case: "המסך הזה חוקר אירוע אחד: מי היה חשוף ולמה, מה קרה למניות, ומה קרה במקרים דומים בעבר." };
function render() { const e = D.events.find(x => x.id === S.ev), h = histOf(S.ev);
  $("steps").innerHTML = [["market", "השוק: " + M.name], ["company", "חברה: " + byId[S.co].name], ["case", "תיק: " + (h ? h[1] : e.name)]].map((s, i) =>
    `<button data-screen="${s[0]}" aria-current="${S.screen === s[0]}"><i>${i + 1}</i>${esc(s[1])}</button>`).join("");
  $("here").textContent = HERE[S.screen];
  ({ market, company, case: caseScreen })[S.screen]();
  if (location.hash.slice(1) !== S.screen) history.replaceState(null, "", "#" + S.screen); }
function go(patch, top = true) { Object.assign(S, patch); render(); if (top) scrollTo({ top: 0 }); }
document.addEventListener("click", ev => { const t = ev.target.closest("[data-screen],[data-co],[data-go],[data-case],[data-tab],[data-range],[data-layer],[data-pick],[data-more],[data-practice],[data-guess]"); if (!t) return;
  const d = t.dataset;
  if (d.screen) go({ screen: d.screen }); else if (d.co || d.go) go({ screen: "company", co: d.co || d.go, tab: "overview", pick: null });
  else if (d.case) go({ screen: "case", ev: d.case, practice: false, guessed: null }); else if (d.tab) go({ tab: d.tab }, false);
  else if (d.range) go({ range: Number(d.range) }, false); else if (d.layer) { S.layers[d.layer] = !S.layers[d.layer]; render(); }
  else if (d.pick) go({ pick: d.pick }, false); else if (d.more) { S.more[d.more] = true; render(); }
  else if ("practice" in d) go({ practice: !S.practice, guessed: null }, false); else if (d.guess) go({ guessed: d.guess }, false); });
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (HERE[v] && v !== S.screen) go({ screen: v }); });
D.nodes.forEach(n => { const o = document.createElement("option"); o.value = n.name; o.label = n.ticker; $("names").appendChild(o); });
$("q").addEventListener("change", e => { const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const n = D.nodes.find(n => n.name.toLowerCase() === v || n.ticker.toLowerCase() === v) || D.nodes.find(n => n.name.toLowerCase().includes(v));
  if (n) { e.target.value = ""; go({ screen: "company", co: n.id, tab: "overview", pick: null }); } });
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const label = () => { $("theme").textContent = isDark() ? "תצוגה בהירה" : "תצוגה כהה"; };
try { const t = localStorage.getItem("market-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("theme").addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("market-theme", root.dataset.theme); } catch (e) {} label(); });
label();
$("foot").textContent = `סקיצה. נבדק לאחרונה: ${M.checked}. המספרים על חברות מגיעים מ-Yahoo Finance ומדיווחים לרשויות. כלי מחקר ולמידה אישי, לא המלצת השקעה.`;
if (HERE[location.hash.slice(1)]) S.screen = location.hash.slice(1);
render();
</script>
