<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. A definition and one chain diagram stay open; everything else sits in
   five closed drawers. Three depths only: row -> drawer -> company card. Market-agnostic. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --raised: #eef1f4; --fg: #15202a; --muted: #5a6876; --line: #d3dae0;
  --accent: #0a6f82; --accent-soft: #dcf0f3;
  --good: #1b7f45; --warn: #946200; --bad: #c0392b;
  --font: "Heebo", "Segoe UI", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1419; --surface: #172028; --raised: #1f2a33; --fg: #e8eef2; --muted: #9cabb8; --line: #33424e;
  --accent: #5ac8da; --accent-soft: #133a43; --good: #63d48f; --warn: #e6b54a; --bad: #ff8372; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1419; --surface: #172028; --raised: #1f2a33; --fg: #e8eef2; --muted: #9cabb8; --line: #33424e;
  --accent: #5ac8da; --accent-soft: #133a43; --good: #63d48f; --warn: #e6b54a; --bad: #ff8372; color-scheme: dark }
* { box-sizing: border-box } [hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55; direction: rtl;
  padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
button, input { font-family: inherit } :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
a { color: var(--accent) } .src { font-size: 12.5px; color: var(--muted) }
.num { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums }
.neg { color: var(--bad) } .pos { color: var(--good) } .muted { color: var(--muted) } .small { font-size: 13.5px }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between }
.top small { color: var(--muted); font-size: 13px }
h1 { font-size: 30px; font-weight: 700; margin: 0; line-height: 1.2 }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0 }
input[type=search] { font-size: 15px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 220px; min-width: 0; max-width: 100% }
.btn { font-size: 13.5px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer }
.def { font-size: 18px; margin: 0; max-width: 62ch }
/* chain */
.chain { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; min-width: 0 }
.chain button { flex: 1 0 104px; display: flex; flex-direction: column; gap: 2px; text-align: start; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 10px 9px; cursor: pointer; color: var(--fg); position: relative }
.chain button:hover { border-color: var(--accent) } .chain b { font-size: 14.5px; line-height: 1.25 } .chain span { font-size: 12px; color: var(--muted) }
.chain i { font: 400 11px var(--mono); color: var(--muted); font-style: normal }
.flow { font-size: 12.5px; color: var(--muted); margin: -6px 0 0 }
/* drawers */
details.drawer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
details.drawer > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; gap: 12px; align-items: baseline; justify-content: space-between }
summary::-webkit-details-marker { display: none }
details.drawer > summary h2 { font-size: 19px; margin: 0; font-weight: 700 }
details.drawer > summary { flex-wrap: wrap }
details.drawer > summary h2 { flex: 0 0 auto }
details.drawer > summary span { color: var(--muted); font-size: 14px; flex: 1 1 200px; min-width: 0 }
details.drawer > summary::after, details.row > summary::after { content: "+"; font: 400 20px var(--mono); color: var(--muted); line-height: 1 }
details[open] > summary::after { content: "–" }
.body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 4px }
details.row { border-top: 1px solid var(--line) }
details.row > summary { list-style: none; cursor: pointer; padding: 11px 0; display: flex; gap: 10px; align-items: baseline; justify-content: space-between }
details.row > summary { flex-wrap: wrap }
details.row > summary .t { font-weight: 500; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere } details.row > summary .d { color: var(--muted); font-size: 14px; flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere }
details.row > .in { padding: 0 0 14px; display: flex; flex-direction: column; gap: 10px }
h3 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 0 0 }
p { margin: 0 } .in p { max-width: 68ch }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px } ul.list li { font-size: 15px; overflow-wrap: anywhere }
.more { font-size: 14px; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; align-self: flex-start }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px 16px }
.kv div { display: flex; flex-direction: column } .kv span { font-size: 12.5px; color: var(--muted) } .kv b { font-size: 16px; font-weight: 500 }
.tag { font-size: 12px; border-radius: 10px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
.tag.good { color: var(--good); border-color: var(--good) } .tag.warn { color: var(--warn); border-color: var(--warn) } .tag.bad { color: var(--bad); border-color: var(--bad) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { font-size: 14px; color: var(--fg); background: var(--raised); border: 1px solid transparent; border-radius: 16px; padding: 3px 12px; cursor: pointer }
.chips button:hover { border-color: var(--accent) } .chips button .num { color: var(--muted); font-size: 12px }
.stageblock { border-top: 1px solid var(--line); padding: 12px 0 6px; display: flex; flex-direction: column; gap: 8px }
.stageblock b { font-size: 15px }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s }
ol.steps > li { counter-increment: s } ol.steps details.row > summary .t::before { content: counter(s) ". "; color: var(--muted); font-family: var(--mono) }
table { border-collapse: collapse; width: 100%; font-size: 14px } th, td { text-align: start; padding: 5px 8px; border-bottom: 1px solid var(--line) }
th { color: var(--muted); font-weight: 500; font-size: 12.5px } .scroll { overflow-x: auto; min-width: 0 }
button.go { font-size: inherit; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: start }
.foot { font-size: 12.5px; color: var(--muted); max-width: 80ch }
/* company card */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 0; width: min(760px, calc(100vw - 24px)); max-height: min(88vh, 900px) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
.dlg { padding: 18px; display: flex; flex-direction: column; gap: 12px }
.dlg header { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between }
.dlg h2 { font-size: 22px; margin: 0 } .tk { font: 500 13px var(--mono); color: var(--muted); direction: ltr }
.mini { background: var(--raised); border-radius: 10px; overflow-x: auto } .mini svg { display: block; width: 100%; min-width: 520px; height: auto; direction: ltr }
.mini text { font: 500 11.5px var(--font); fill: var(--fg) } .mini .cap { font-size: 11px; fill: var(--muted) }
.mini rect { fill: var(--surface); stroke: var(--line) } .mini .me rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2 }
.mini g[data-go] { cursor: pointer } .mini g[data-go]:hover rect { stroke: var(--accent) } .mini path { fill: none; stroke: var(--muted); opacity: .6 }
.spark { display: block; width: 100%; height: 64px }
.qbars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; height: 92px; direction: ltr; max-width: 360px }
.qbars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; height: 100%; font: 400 11.5px var(--mono); color: var(--muted) }
.qbars i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .85 }
</style>

<div class="wrap">
  <div class="top">
    <div><small>שוק · סקיצה</small><h1 id="name"></h1></div>
    <div class="tools">
      <input type="search" id="q" list="names" placeholder="חיפוש חברה" autocomplete="off" aria-label="חיפוש חברה"><datalist id="names"></datalist>
      <button class="btn" id="theme" type="button"></button>
    </div>
  </div>
  <p class="def" id="def"></p>
  <div class="chain" id="chain" aria-label="שלבי השוק"></div>
  <p class="flow">הסחורה עוברת מימין לשמאל. לחיצה על שלב פותחת אותו.</p>

  <details class="drawer" name="main" id="d-structure"><summary><h2>מבנה השוק</h2><span>השלבים, ומה כל אחד מהם עושה</span></summary><div class="body" id="b-structure"></div></details>
  <details class="drawer" name="main" id="d-players"><summary><h2>שחקנים</h2><span>הגדולים והקטנים בכל שלב</span></summary><div class="body" id="b-players"></div></details>
  <details class="drawer" name="main" id="d-life"><summary><h2>מחזור חיים</h2><span>הדרך של מוצר אחד, וכמה זמן כל צעד לוקח</span></summary><div class="body" id="b-life"></div></details>
  <details class="drawer" name="main" id="d-history"><summary><h2>מה היה</h2><span>אירועים שעיצבו את השוק</span></summary><div class="body" id="b-history"></div></details>
  <details class="drawer" name="main" id="d-changes"><summary><h2>מה משתנה</h2><span>רגולציה, טכנולוגיה ומהלכים עסקיים שפתוחים עכשיו</span></summary><div class="body" id="b-changes"></div></details>

  <p class="foot" id="foot"></p>
</div>
<dialog id="card" aria-label="כרטיס חברה"><div class="dlg" id="dlg"></div></dialog>

<script>
const D = /*__DATA__*/null, M = D.market;
const L = { roles: { hit: "נפגעה ישירות", down1: "לקוחה של נפגעת", down2: "לקוחה של לקוחה", up1: "ספקית של נפגעת", up2: "ספקית של ספקית", rival: "מתחרה של נפגעת", control: "לא קשורה" },
  conf: { high: ["מאומת", "good"], medium: ["עיתונות", "warn"], low: ["לא מאומת", "bad"] },
  kind: { report: ["מהדוח של החברה", "good"], industry: ["מקור ענפי", ""], press: ["עיתונות", "warn"] },
  type: { regulation: "רגולציה", technology: "טכנולוגיה", move: "מהלכים עסקיים" },
  effect: { shortens: ["מקצר", "good"], adds: ["מוסיף קיבולת", "good"], delays: ["מעכב", "warn"], blocks: ["חוסם", "bad"], other: ["שינוי בעלות", ""] },
  country: { US: "ארה\"ב", JP: "יפן", TW: "טייוואן", KR: "קוריאה", DE: "גרמניה", NL: "הולנד", IL: "ישראל", CN: "סין", FR: "צרפת", CH: "שווייץ" } };
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = v => !v ? "–" : (v < 0 ? "-" : "") + "$" + (Math.abs(v) >= 1e12 ? (Math.abs(v) / 1e12).toFixed(2) + "T" : Math.abs(v) >= 1e9 ? (Math.abs(v) / 1e9).toFixed(Math.abs(v) >= 1e11 ? 0 : 1) + "B" : (Math.abs(v) / 1e6).toFixed(0) + "M");
const f1 = (v, m = 1, s = "") => v == null ? "–" : (v * m).toFixed(1) + s;
const pct = v => v == null ? "–" : `<span class="num ${v < 0 ? "neg" : v > 0 ? "pos" : ""}">${v > 0 ? "+" : ""}${v}%</span>`;
const src = k => k && D.sources[k] ? ` <a class="src" href="${esc(D.sources[k][1])}" target="_blank" rel="noopener">${esc(D.sources[k][0])}</a>` : "";
const tag = (t, c) => `<span class="tag ${c || ""}">${esc(t)}</span>`;
const go = id => `<button class="go" data-go="${id}">${esc(byId[id].name)}</button>`;
const stage = t => D.stages[t].title;
/* show the first n items, the rest behind one "more" button */
const limit = (items, n, label = "עוד") => items.length <= n ? items.join("") :
  items.slice(0, n).join("") + `<span hidden data-more>${items.slice(n).join("")}</span>`;
const list = (items, n) => `<ul class="list">${limit(items.map(x => `<li>${x}</li>`), n)}</ul>` +
  (items.length > n ? `<button class="more" data-more-btn>עוד ${items.length - n}</button>` : "");
const row = (t, d, inner, id) => `<details class="row"${id ? ` id="${id}"` : ""}><summary><span class="t">${t}</span><span class="d">${d}</span></summary><div class="in">${inner}</div></details>`;

/* ---------- top ---------- */
$("name").textContent = M.name; $("def").textContent = M.definition;
$("chain").innerHTML = D.tiers.map(t => { const a = D.agg[t];
  return `<button data-stage="${t}"><b>${esc(stage(t))}</b><span>${a.n} חברות</span><i>${usd(a.revenue)}</i></button>`; }).join("");
$("chain").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  openDrawer("d-structure"); const r = $("st-" + b.dataset.stage); r.open = true; r.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
function openDrawer(id) { document.querySelectorAll("details.drawer").forEach(d => { d.open = d.id === id; }); }
document.querySelectorAll("details.drawer").forEach(d => d.addEventListener("toggle", () => { if (d.open)
  document.querySelectorAll("details.drawer").forEach(o => { if (o !== d) o.open = false; }); }));
document.addEventListener("click", e => { const m = e.target.closest("[data-more-btn]");
  if (m) { const box = m.previousElementSibling.querySelector("[data-more]") || m.parentElement.querySelector("[data-more]"); if (box) box.hidden = false; m.remove(); return; }
  const g = e.target.closest("[data-go]"); if (g) openCard(g.dataset.go); });

/* ---------- 1. structure ---------- */
$("b-structure").innerHTML = D.tiers.map(t => { const s = D.stages[t], a = D.agg[t];
  const first = s.what.split(". ")[0].replace(/\.$/, "") + ".";
  return row(esc(s.title), esc(first), `<p>${esc(s.what)}</p>
    <div class="kv"><div><span>חברות במפה</span><b class="num">${a.n}</b></div>
      <div><span>איפה הן יושבות</span><b style="font-size:14.5px">${a.countries.slice(0, 3).map(c => `${L.country[c[0]] || c[0]} ${c[1]}`).join(" · ")}</b></div>
      <div><span>הכנסות שנתיות יחד</span><b class="num">${usd(a.revenue)}</b></div><div><span>רווח נקי יחד</span><b class="num">${usd(a.net)}</b></div></div>
    <h3>עובדות</h3>${list(s.facts.map(f => esc(f[0]) + src(f[1])), 3)}
    <h3>נקודות תורפה</h3>${list(s.choke.map(f => esc(f[0]) + src(f[1])), 2)}`, "st-" + t); }).join("");

/* ---------- 2. players ---------- */
$("b-players").innerHTML = D.tiers.map(t => { const ns = D.nodes.filter(n => n.tier === t).sort((a, b) => (b.info.revenueUSD || 0) - (a.info.revenueUSD || 0));
  const chip = n => `<button data-go="${n.id}">${esc(n.name)} <span class="num">${usd(n.info.revenueUSD)}</span></button>`;
  return `<div class="stageblock"><b>${esc(stage(t))}</b><div class="chips">${limit(ns.map(chip), 4)}</div>${
    ns.length > 4 ? `<button class="more" data-more-btn>עוד ${ns.length - 4} קטנות יותר</button>` : ""}</div>`; }).join("") +
  `<p class="small muted">המספר ליד כל חברה הוא ההכנסות השנתיות שלה. לחיצה פותחת כרטיס חברה.</p>`;

/* ---------- 3. lifecycle ---------- */
$("b-life").innerHTML = `<ol class="steps">${M.lifecycle.map(s => `<li>${row(esc(s[0]), `<span class="num" style="direction:rtl">${esc(s[1])}</span>`,
    `<p>${esc(s[3])}${src(s[4])}</p><h3>איך מזמינים ומשלמים בשלב הזה</h3>${list(D.stages[s[2]].pulse.map(p => tag(...L.kind[p[0]]) + " " + esc(p[1]) + src(p[2])), 3)}`)}</li>`).join("")}</ol>
  <p class="small" style="border-top:1px solid var(--line);padding-top:12px"><b>${esc(M.lifecycle_total[0])}:</b> ${esc(M.lifecycle_total[1])}.${src(M.lifecycle_total[2])}</p>`;

/* ---------- 4. history ---------- */
$("b-history").innerHTML = [...M.history].reverse().map(h => { let react = "";
  const ev = D.events.find(e => e.id === h[5]);
  if (ev) { const hit = ev.hit.filter(id => byId[id] && byId[id].ev[ev.id]);
    const avg = role => { const v = D.nodes.filter(n => n.ev[ev.id] && n.ev[ev.id].role === role).map(n => n.ev[ev.id].d3); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; };
    react = `<h3>איך המניות הגיבו</h3><div class="scroll"><table><thead><tr><th>חברה</th><th>יום האירוע</th><th>אחרי 3 ימים</th><th>אחרי 10 ימים</th></tr></thead><tbody>${
      hit.map(id => { const r = byId[id].ev[ev.id]; return `<tr><td>${go(id)}</td><td>${pct(r.d0)}</td><td>${pct(r.d3)}</td><td>${pct(r.d10)}</td></tr>`; }).join("")}
      <tr><td class="muted">לקוחות של הנפגעות, ממוצע</td><td></td><td>${pct(avg("down1"))}</td><td></td></tr></tbody></table></div>
      <p class="small muted">תנועה חריגה: אחרי ניכוי התנועה של השוק המקומי באותם ימים.</p>`; }
  return row(`<span class="num">${esc(h[0])}</span> ${esc(h[1])}`, esc(stage(h[3])), `<p>${esc(h[2])}${src(h[4])} ${h[6] ? "" : tag("לא אומת מול המקור", "bad")}</p>${react}`); }).join("");

/* ---------- 5. changes ---------- */
$("b-changes").innerHTML = Object.keys(L.type).map(ty => { const items = M.changes.filter(c => c[0] === ty).sort((a, b) => b[5].localeCompare(a[5]));
  const rows = items.map(c => row(`${tag(...L.effect[c[1]])} ${esc(c[3])}`, `<span class="num">${esc(c[5])}</span>`,
    `<p>${esc(c[4])}${src(c[7])} ${c[8] ? "" : tag("לא אומת מול המקור", "bad")}</p>
     <div class="kv"><div><span>על איזה שלב</span><b style="font-size:15px">${esc(stage(c[2]))}</b></div><div><span>מצב</span><b style="font-size:15px">${esc(c[6])}</b></div>
     <div><span>נבדק לאחרונה</span><b class="num" style="font-size:15px">${esc(M.checked)}</b></div></div>`));
  return `<div class="stageblock" style="gap:0"><b style="margin-bottom:8px">${L.type[ty]}</b>${limit(rows, 4)}${rows.length > 4 ? `<button class="more" data-more-btn>עוד ${rows.length - 4}</button>` : ""}</div>`; }).join("");

/* ---------- company card ---------- */
function spark(a) { const lo = Math.min(...a), hi = Math.max(...a), w = 300, h = 64;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="הכנסות חודשיות"><polyline points="${
    a.map((v, i) => `${(i / (a.length - 1) * w).toFixed(1)},${(h - 6 - (v - lo) / (hi - lo || 1) * (h - 12)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`; }
function qbars(s) { const v = ["Q1", "Q2", "Q3", "Q4"].map(k => s[k]), lo = Math.min(...v, 90) - 4, hi = Math.max(...v, 110);
  return `<div class="qbars">${v.map((x, i) => `<div><span class="num">${x.toFixed(0)}</span><i style="height:${Math.max(6, (x - lo) / (hi - lo) * 100)}%"></i><span>Q${i + 1}</span></div>`).join("")}</div>`; }
function mini(n, sup, cus) { const cap = 6, S = sup.slice(0, cap), C = cus.slice(0, cap), rows = Math.max(S.length, C.length, 1), H = 44 + rows * 30, W = 560, bw = 150, bh = 22;
  const y = (i, k) => 34 + (rows - k) * 15 + i * 30, box = (x, yy, o, cls) => `<g ${o ? `data-go="${o.id}"` : ""} class="${cls || ""}"><rect x="${x}" y="${yy}" width="${bw}" height="${bh}" rx="6"/><text x="${x + bw / 2}" y="${yy + 15}" text-anchor="middle">${esc((o ? o.name : n.name).slice(0, 20))}</text></g>`;
  const cy = H / 2 + 6, mx = (W - bw) / 2;
  const line = (x1, y1, x2, y2, m) => `<path d="M${x1} ${y1}C${(x1 + x2) / 2} ${y1},${(x1 + x2) / 2} ${y2},${x2} ${y2}" stroke-width="${m ? 2.4 : 1}"/>`;
  return `<div class="mini"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ספקים ולקוחות של ${esc(n.name)}">
    <text class="cap" x="${W - 10 - bw / 2}" y="18" text-anchor="middle" direction="rtl">ספקים${sup.length > cap ? ` (${cap} מתוך ${sup.length})` : ""}</text>
    <text class="cap" x="${10 + bw / 2}" y="18" text-anchor="middle" direction="rtl">לקוחות${cus.length > cap ? ` (${cap} מתוך ${cus.length})` : ""}</text>
    ${S.map((e, i) => line(W - 10 - bw, y(i, S.length) + bh / 2, mx + bw, cy, e.material)).join("")}${C.map((e, i) => line(mx, cy, 10 + bw, y(i, C.length) + bh / 2, e.material)).join("")}
    ${S.map((e, i) => box(W - 10 - bw, y(i, S.length), byId[e.s])).join("")}${C.map((e, i) => box(10, y(i, C.length), byId[e.t])).join("")}${box(mx, cy - bh / 2, null, "me")}</svg></div>`; }
D.edges.forEach(e => { e.material = e.crit || Number(e.share) >= 10; });
const byWeight = (a, b) => (b.material - a.material) || (Number(b.share || 0) - Number(a.share || 0));
function openCard(id) { const n = byId[id], i = n.info, p = n.pulse || {};
  const sup = D.edges.filter(e => e.t === id).sort(byWeight), cus = D.edges.filter(e => e.s === id).sort(byWeight);
  const link = (e, o) => `${go(o)} ${tag(...L.conf[e.conf])}${e.material ? " " + tag("קשר מהותי") : ""}${e.share ? ` <span class="num">${e.share}%</span> <span class="muted small">מהכנסות הספק</span>` : ""}
    <div class="small muted">${esc(e.what)}${e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">מקור</a>` : ""}</div>`;
  const pulse = [];
  if (p.monthly) pulse.push(`<h3>הכנסות חודשיות, 36 חודשים</h3>${spark(p.monthly.series)}<p class="small muted">החודש האחרון: <span class="num">${esc(p.monthly.last)}</span>, ${pct(p.monthly.yoy)} לעומת אשתקד.</p>`);
  if (p.seasonality) pulse.push(`<h3>עונתיות לפי רבעון (100 = רבעון רגיל)</h3>${qbars(p.seasonality)}`);
  const kv = [];
  if (p.inventory_days) kv.push(["ימי מלאי", p.inventory_days.latest]);
  if (p.purchase_obligation) kv.push(["התחייבויות רכש לספקים", usd(p.purchase_obligation.value)]);
  if (p.remaining_performance_obligation) kv.push(["התחייבויות של לקוחות", usd(p.remaining_performance_obligation.value)]);
  if (p.customer_prepayments) kv.push(["מקדמות מלקוחות", usd(p.customer_prepayments.value)]);
  if (kv.length) pulse.push(`<div class="kv">${kv.map(k => `<div><span>${k[0]}</span><b class="num">${k[1]}</b></div>`).join("")}</div>`);
  pulse.push(`<h3>מה נהוג בשלב הזה</h3>${list(D.stages[n.tier].pulse.map(x => tag(...L.kind[x[0]]) + " " + esc(x[1]) + src(x[2])), 2)}`);
  const evRows = D.events.filter(e => n.ev[e.id] && n.ev[e.id].role !== "control").map(e => { const r = n.ev[e.id];
    return `<tr><td>${esc(e.name)}</td><td>${L.roles[r.role]}</td><td>${pct(r.d3)}</td><td>${pct(r.d10)}</td></tr>`; });
  const sections = [
    (sup.length + cus.length) && row("ספקים ולקוחות", `${sup.length} ספקים, ${cus.length} לקוחות`,
      `<h3>לקוחות</h3>${list(cus.map(e => link(e, e.t)), 4) || '<p class="muted small">לא נמצאו</p>'}<h3>ספקים</h3>${list(sup.map(e => link(e, e.s)), 4) || '<p class="muted small">לא נמצאו</p>'}`),
    row("קצב הזמנות ומכירות", p.monthly ? "נתונים חודשיים" : p.seasonality ? "נתונים רבעוניים" : "רק מה שנהוג בשלב", pulse.join("")),
    (n.people.length || n.holders.length) && row("אנשים ובעלים", `${n.people.length} נושאי משרה, ${n.holders.length} מחזיקים`,
      `<h3>נושאי משרה ודירקטורים</h3>${list(n.people.map(x => `${esc(x.n)} <span class="muted small">${esc(x.t)}</span>${x.also.filter(o => byId[o]).length ? `<div class="small muted">אותו שם מופיע גם ב: ${x.also.filter(o => byId[o]).map(go).join(", ")} ${tag("לפי שם בלבד", "warn")}</div>` : ""}`), 4)}
       <h3>מחזיקים מוסדיים גדולים</h3>${list(n.holders.map(h => `${esc(h.n)} <span class="num">${h.p}%</span>`), 4) || '<p class="muted small">אין נתונים ממקור חינמי</p>'}`),
    evRows.length && row("תגובה לאירועי עבר", `${evRows.length} אירועים`, `<div class="scroll"><table><thead><tr><th>אירוע</th><th>התפקיד</th><th>אחרי 3 ימים</th><th>אחרי 10 ימים</th></tr></thead><tbody>${evRows.join("")}</tbody></table></div>`),
    row("נתונים נוספים", "רווחיות, שווי ואתרים", `<div class="kv"><div><span>שווי שוק</span><b class="num">${usd(i.marketCapUSD)}</b></div><div><span>רווח גולמי</span><b class="num">${f1(i.grossMargins, 100, "%")}</b></div>
      <div><span>רווח תפעולי</span><b class="num">${f1(i.operatingMargins, 100, "%")}</b></div><div><span>מכפיל רווח</span><b class="num">${f1(i.trailingPE)}</b></div>
      <div><span>צמיחת הכנסות</span><b class="num">${f1(i.revenueGrowth, 100, "%")}</b></div><div><span>שינוי ב-52 שבועות</span><b class="num">${f1(i.fiftyTwoWeekChange, 100, "%")}</b></div></div>
      <h3>מטה</h3><p class="small">${esc([i.city, i.country].filter(Boolean).join(", ") || "–")}</p><h3>אתרי ייצור</h3><p class="small">${esc(n.sites)}</p>`)].filter(Boolean);
  $("dlg").innerHTML = `<header><div><h2>${esc(n.name)} <span class="tk">${esc(n.ticker)}</span></h2>
      <p class="muted small">${esc(stage(n.tier))} · ${L.country[n.country] || n.country}</p></div><button class="btn" data-close type="button">סגירה</button></header>
    <div class="kv"><div><span>הכנסות שנתיות</span><b class="num">${usd(i.revenueUSD)}</b></div><div><span>רווח נקי</span><b class="num">${usd(i.netIncomeUSD)}</b></div>
      <div><span>עובדים</span><b class="num">${i.fullTimeEmployees ? i.fullTimeEmployees.toLocaleString("en") : "–"}</b></div></div>
    ${sup.length + cus.length ? mini(n, sup, cus) + '<p class="small muted">קו עבה: קשר מהותי. לחיצה על חברה עוברת אליה.</p>' : ""}
    <div>${sections.join("")}</div>`;
  const dlg = $("card"); if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); } dlg.scrollTop = 0; }
$("card").addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target === $("card")) $("card").close(); });

/* ---------- search, theme, footer ---------- */
D.nodes.forEach(n => { const o = document.createElement("option"); o.value = n.name; o.label = n.ticker; $("names").appendChild(o); });
$("q").addEventListener("change", e => { const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const n = D.nodes.find(n => n.name.toLowerCase() === v || n.ticker.toLowerCase() === v) || D.nodes.find(n => n.name.toLowerCase().includes(v));
  if (n) { openCard(n.id); e.target.value = ""; } });
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const label = () => { $("theme").textContent = isDark() ? "תצוגה בהירה" : "תצוגה כהה"; };
try { const t = localStorage.getItem("market-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("theme").addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("market-theme", root.dataset.theme); } catch (e) {} label(); });
label();
$("foot").textContent = `נבדק לאחרונה: ${M.checked}. ${D.nodes.length} חברות ו-${D.edges.length} קשרי ספק ולקוח. המספרים על חברות מגיעים מ-Yahoo Finance ומדיווחים לרשויות, וההסברים מדוחות שנתיים וממקורות ענפיים שמקושרים ליד כל טענה. כלי מחקר ולמידה אישי, לא המלצת השקעה.`;
</script>
