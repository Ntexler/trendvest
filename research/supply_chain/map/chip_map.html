  `<p class="small muted">המספר ליד כל חברה הוא ההכנסות השנתיות שלה. לחיצה פותחת כרטיס חברה.</p>`;

/* ---------- 3. lifecycle ---------- */
$("b-life").innerHTML = `<ol class="steps">${M.lifecycle.map(s => `<li>${row(esc(s[0]), `<span class="num" style="direction:rtl">${esc(s[1])}</span>`,
    `<p>${esc(s[3])}${src(s[4])}</p><h3>איך מזמינים ומשלמים בשלב הזה</h3>${list(D.stages[s[2]].pulse.map(p => tag(...L.kind[p[0]]) + " " + esc(p[1]) + src(p[2])), 3)}`)}</li>`).join("")}</ol>
  <p class="small" style="border-top:1px solid var(--line);padding-top:12px"><b>${esc(M.lifecycle_total[0])}:</b> ${esc(M.lifecycle_total[1])}.${src(M.lifecycle_total[2])}</p>`;

/* ---------- 4. history ---------- */
$("b-history").innerHTML = [...M.history].reverse().map(h => { let react = "";
  const ev = D.events.find(e => e.id === h[5]);
  if (ev) { const hit = ev.hit.filter(id => byId[id] && byId[id].ev[ev.id]);
    const avg = role => { const v = D.nodes.filter(n => n.ev[ev.id] && n.ev[ev.id].role === role).map(n => n.ev[ev.id].d3); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; };
    react = `<h3>איך המניות הגיבו</h3><div class="scroll"><table><thead><tr><th>חברה</th><th>יום האירוע</th><th>אחרי 3 ימים</th><th>אחרי 10 ימים</th></tr></thead><tbody>${
      hit.map(id => { const r = byId[id].ev[ev.id]; return `<tr><td>${go(id)}</td><td>${pct(r.d0)}</td><td>${pct(r.d3)}</td><td>${pct(r.d10)}</td></tr>`; }).join("")}
      <tr><td class="muted">לקוחות של הנפגעות, ממוצע</td><td></td><td>${pct(avg("down1"))}</td><td></td></tr></tbody></table></div>
      <p class="small muted">תנועה חריגה: אחרי ניכוי התנועה של השוק המקומי באותם ימים.</p>`; }
  return row(`<span class="num">${esc(h[0])}</span> ${esc(h[1])}`, esc(stage(h[3])), `<p>${esc(h[2])}${src(h[4])} ${h[6] ? "" : tag("לא אומת מול המקור", "bad")}</p>${react}`); }).join("");

/* ---------- 5. changes ---------- */
$("b-changes").innerHTML = Object.keys(L.type).map(ty => { const items = M.changes.filter(c => c[0] === ty).sort((a, b) => b[5].localeCompare(a[5]));
  const rows = items.map(c => row(`${tag(...L.effect[c[1]])} ${esc(c[3])}`, `<span class="num">${esc(c[5])}</span>`,
    `<p>${esc(c[4])}${src(c[7])} ${c[8] ? "" : tag("לא אומת מול המקור", "bad")}</p>
     <div class="kv"><div><span>על איזה שלב</span><b style="font-size:15px">${esc(stage(c[2]))}</b></div><div><span>מצב</span><b style="font-size:15px">${esc(c[6])}</b></div>
     <div><span>נבדק לאחרונה</span><b class="num" style="font-size:15px">${esc(M.checked)}</b></div></div>`));
  return `<div class="stageblock" style="gap:0"><b style="margin-bottom:8px">${L.type[ty]}</b>${limit(rows, 4)}${rows.length > 4 ? `<button class="more" data-more-btn>עוד ${rows.length - 4}</button>` : ""}</div>`; }).join("");

/* ---------- company card ---------- */
function spark(a) { const lo = Math.min(...a), hi = Math.max(...a), w = 300, h = 64;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="הכנסות חודשיות"><polyline points="${
    a.map((v, i) => `${(i / (a.length - 1) * w).toFixed(1)},${(h - 6 - (v - lo) / (hi - lo || 1) * (h - 12)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`; }
function qbars(s) { const v = ["Q1", "Q2", "Q3", "Q4"].map(k => s[k]), lo = Math.min(...v, 90) - 4, hi = Math.max(...v, 110);
  return `<div class="qbars">${v.map((x, i) => `<div><span class="num">${x.toFixed(0)}</span><i style="height:${Math.max(6, (x - lo) / (hi - lo) * 100)}%"></i><span>Q${i + 1}</span></div>`).join("")}</div>`; }
function mini(n, sup, cus) { const cap = 6, S = sup.slice(0, cap), C = cus.slice(0, cap), rows = Math.max(S.length, C.length, 1), H = 44 + rows * 30, W = 560, bw = 150, bh = 22;
  const y = (i, k) => 34 + (rows - k) * 15 + i * 30, box = (x, yy, o, cls) => `<g ${o ? `data-go="${o.id}"` : ""} class="${cls || ""}"><rect x="${x}" y="${yy}" width="${bw}" height="${bh}" rx="6"/><text x="${x + bw / 2}" y="${yy + 15}" text-anchor="middle">${esc((o ? o.name : n.name).slice(0, 20))}</text></g>`;
  const cy = H / 2 + 6, mx = (W - bw) / 2;
  const line = (x1, y1, x2, y2, m) => `<path d="M${x1} ${y1}C${(x1 + x2) / 2} ${y1},${(x1 + x2) / 2} ${y2},${x2} ${y2}" stroke-width="${m ? 2.4 : 1}"/>`;
  return `<div class="mini"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ספקים ולקוחות של ${esc(n.name)}">
    <text class="cap" x="${W - 10 - bw / 2}" y="18" text-anchor="middle" direction="rtl">ספקים${sup.length > cap ? ` (${cap} מתוך ${sup.length})` : ""}</text>
    <text class="cap" x="${10 + bw / 2}" y="18" text-anchor="middle" direction="rtl">לקוחות${cus.length > cap ? ` (${cap} מתוך ${cus.length})` : ""}</text>
    ${S.map((e, i) => line(W - 10 - bw, y(i, S.length) + bh / 2, mx + bw, cy, e.material)).join("")}${C.map((e, i) => line(mx, cy, 10 + bw, y(i, C.length) + bh / 2, e.material)).join("")}
    ${S.map((e, i) => box(W - 10 - bw, y(i, S.length), byId[e.s])).join("")}${C.map((e, i) => box(10, y(i, C.length), byId[e.t])).join("")}${box(mx, cy - bh / 2, null, "me")}</svg></div>`; }
D.edges.forEach(e => { e.material = e.crit || Number(e.share) >= 10; });
const byWeight = (a, b) => (b.material - a.material) || (Number(b.share || 0) - Number(a.share || 0));
function openCard(id) { const n = byId[id], i = n.info, p = n.pulse || {};
  const sup = D.edges.filter(e => e.t === id).sort(byWeight), cus = D.edges.filter(e => e.s === id).sort(byWeight);
  const link = (e, o) => `${go(o)} ${tag(...L.conf[e.conf])}${e.material ? " " + tag("קשר מהותי") : ""}${e.share ? ` <span class="num">${e.share}%</span> <span class="muted small">מהכנסות הספק</span>` : ""}
    <div class="small muted">${esc(e.what)}${e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">מקור</a>` : ""}</div>`;
  const pulse = [];
  if (p.monthly) pulse.push(`<h3>הכנסות חודשיות, 36 חודשים</h3>${spark(p.monthly.series)}<p class="small muted">החודש האחרון: <span class="num">${esc(p.monthly.last)}</span>, ${pct(p.monthly.yoy)} לעומת אשתקד.</p>`);
  if (p.seasonality) pulse.push(`<h3>עונתיות לפי רבעון (100 = רבעון רגיל)</h3>${qbars(p.seasonality)}`);
  const kv = [];
  if (p.inventory_days) kv.push(["ימי מלאי", p.inventory_days.latest]);
  if (p.purchase_obligation) kv.push(["התחייבויות רכש לספקים", usd(p.purchase_obligation.value)]);
  if (p.remaining_performance_obligation) kv.push(["התחייבויות של לקוחות", usd(p.remaining_performance_obligation.value)]);
  if (p.customer_prepayments) kv.push(["מקדמות מלקוחות", usd(p.customer_prepayments.value)]);
  if (kv.length) pulse.push(`<div class="kv">${kv.map(k => `<div><span>${k[0]}</span><b class="num">${k[1]}</b></div>`).join("")}</div>`);
  pulse.push(`<h3>מה נהוג בשלב הזה</h3>${list(D.stages[n.tier].pulse.map(x => tag(...L.kind[x[0]]) + " " + esc(x[1]) + src(x[2])), 2)}`);
  const evRows = D.events.filter(e => n.ev[e.id] && n.ev[e.id].role !== "control").map(e => { const r = n.ev[e.id];
    return `<tr><td>${esc(e.name)}</td><td>${L.roles[r.role]}</td><td>${pct(r.d3)}</td><td>${pct(r.d10)}</td></tr>`; });
  const sections = [
    (sup.length + cus.length) && row("ספקים ולקוחות", `${sup.length} ספקים, ${cus.length} לקוחות`,
      `<h3>לקוחות</h3>${list(cus.map(e => link(e, e.t)), 4) || '<p class="muted small">לא נמצאו</p>'}<h3>ספקים</h3>${list(sup.map(e => link(e, e.s)), 4) || '<p class="muted small">לא נמצאו</p>'}`),
    row("קצב הזמנות ומכירות", p.monthly ? "נתונים חודשיים" : p.seasonality ? "נתונים רבעוניים" : "רק מה שנהוג בשלב", pulse.join("")),
    (n.people.length || n.holders.length) && row("אנשים ובעלים", `${n.people.length} נושאי משרה, ${n.holders.length} מחזיקים`,
      `<h3>נושאי משרה ודירקטורים</h3>${list(n.people.map(x => `${esc(x.n)} <span class="muted small">${esc(x.t)}</span>${x.also.filter(o => byId[o]).length ? `<div class="small muted">אותו שם מופיע גם ב: ${x.also.filter(o => byId[o]).map(go).join(", ")} ${tag("לפי שם בלבד", "warn")}</div>` : ""}`), 4)}
       <h3>מחזיקים מוסדיים גדולים</h3>${list(n.holders.map(h => `${esc(h.n)} <span class="num">${h.p}%</span>`), 4) || '<p class="muted small">אין נתונים ממקור חינמי</p>'}`),
    evRows.length && row("תגובה לאירועי עבר", `${evRows.length} אירועים`, `<div class="scroll"><table><thead><tr><th>אירוע</th><th>התפקיד</th><th>אחרי 3 ימים</th><th>אחרי 10 ימים</th></tr></thead><tbody>${evRows.join("")}</tbody></table></div>`),
    row("נתונים נוספים", "רווחיות, שווי ואתרים", `<div class="kv"><div><span>שווי שוק</span><b class="num">${usd(i.marketCapUSD)}</b></div><div><span>רווח גולמי</span><b class="num">${f1(i.grossMargins, 100, "%")}</b></div>
      <div><span>רווח תפעולי</span><b class="num">${f1(i.operatingMargins, 100, "%")}</b></div><div><span>מכפיל רווח</span><b class="num">${f1(i.trailingPE)}</b></div>
      <div><span>צמיחת הכנסות</span><b class="num">${f1(i.revenueGrowth, 100, "%")}</b></div><div><span>שינוי ב-52 שבועות</span><b class="num">${f1(i.fiftyTwoWeekChange, 100, "%")}</b></div></div>
      <h3>מטה</h3><p class="small">${esc([i.city, i.country].filter(Boolean).join(", ") || "–")}</p><h3>אתרי ייצור</h3><p class="small">${esc(n.sites)}</p>`)].filter(Boolean);
  $("dlg").innerHTML = `<header><div><h2>${esc(n.name)} <span class="tk">${esc(n.ticker)}</span></h2>
      <p class="muted small">${esc(stage(n.tier))} · ${L.country[n.country] || n.country}</p></div><button class="btn" data-close type="button">סגירה</button></header>
    <div class="kv"><div><span>הכנסות שנתיות</span><b class="num">${usd(i.revenueUSD)}</b></div><div><span>רווח נקי</span><b class="num">${usd(i.netIncomeUSD)}</b></div>
      <div><span>עובדים</span><b class="num">${i.fullTimeEmployees ? i.fullTimeEmployees.toLocaleString("en") : "–"}</b></div></div>
    ${sup.length + cus.length ? mini(n, sup, cus) + '<p class="small muted">קו עבה: קשר מהותי. לחיצה על חברה עוברת אליה.</p>' : ""}
    <div>${sections.join("")}</div>`;
  const dlg = $("card"); if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); } dlg.scrollTop = 0; }
$("card").addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target === $("card")) $("card").close(); });

/* ---------- search, theme, footer ---------- */
D.nodes.forEach(n => { const o = document.createElement("option"); o.value = n.name; o.label = n.ticker; $("names").appendChild(o); });
$("q").addEventListener("change", e => { const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const n = D.nodes.find(n => n.name.toLowerCase() === v || n.ticker.toLowerCase() === v) || D.nodes.find(n => n.name.toLowerCase().includes(v));
  if (n) { openCard(n.id); e.target.value = ""; } });
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const label = () => { $("theme").textContent = isDark() ? "תצוגה בהירה" : "תצוגה כהה"; };
try { const t = localStorage.getItem("market-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("theme").addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("market-theme", root.dataset.theme); } catch (e) {} label(); });
label();
$("foot").textContent = `נבדק לאחרונה: ${M.checked}. ${D.nodes.length} חברות ו-${D.edges.length} קשרי ספק ולקוח. המספרים על חברות מגיעים מ-Yahoo Finance ומדיווחים לרשויות, וההסברים מדוחות שנתיים וממקורות ענפיים שמקושרים ליד כל טענה. כלי מחקר ולמידה אישי, לא המלצת השקעה.`;
</script>
