<title>TrendVest</title>

<style>

<div class="wrap">
  <nav class="mk" id="mk" aria-label="שווקים"></nav>
  <div class="top" id="top" hidden>
    <div class="switch" role="tablist"><button role="tab" data-v="stock">מניה</button><button role="tab" data-v="heat">מפת חום</button><button role="tab" data-v="event">מה קרה</button><button role="tab" data-v="next">מה הלאה</button><button role="tab" data-v="build">בונה תיק</button><button role="tab" data-v="wallet">הארנק</button></div>
    <div style="display:flex;gap:8px;min-width:0"><input type="search" id="q" list="names" placeholder="חיפוש חברה" aria-label="חיפוש חברה" autocomplete="off"><datalist id="names"></datalist><button class="ghost" id="theme" type="button"></button></div>
  </div>
  <main id="page" class="wrap" style="gap:16px"></main>
  <p class="foot" id="foot">סקיצה. הנתונים מ-Yahoo Finance ומדיווחים רשמיים של החברות. כשכתוב "מעבר למה שכל השוק זז", הכוונה שהורדנו את מה שכל המניות עשו באותם ימים, כדי לראות רק את ההשפעה של האירוע. זה כלי ללמידה אישית, לא המלצה לקנות או למכור.</p>
</div>

<script>
const CN = { US: "ארה\"ב", JP: "יפן", TW: "טייוואן", KR: "קוריאה", DE: "גרמניה", NL: "הולנד", IL: "ישראל", CN: "סין", FR: "צרפת", CH: "שווייץ", GB: "בריטניה", AU: "אוסטרליה", CA: "קנדה", DK: "דנמרק", ES: "ספרד", IT: "איטליה", BR: "ברזיל", CL: "צ'ילה", IN: "הודו", NO: "נורווגיה", SE: "שוודיה", HK: "הונג קונג", IE: "אירלנד" };
const go = id => { location.hash = id; location.reload(); };
function nav(C, cur) { const el = document.getElementById("mk");
  el.innerHTML = `<button data-m="" aria-current="${!C.markets[cur] && cur !== "wallet"}">כל השווקים</button>` + C.order.map(m => `<button data-m="${m}" aria-current="${m === cur}">${C.markets[m].name}</button>`).join("") + `<button data-m="wallet" aria-current="${cur === "wallet"}" class="wbtn">הארנק שלי</button>`;
  el.addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.m); }); }
function hub(C) { const ms = C.order.map(m => C.markets[m]), page = document.getElementById("page"), big = v => "$" + (v >= 1e12 ? (v / 1e12).toFixed(1) + "T" : (v / 1e9).toFixed(0) + "B");

  const endP = vp[vp.length - 1], endM = vm[vm.length - 1];

  return `<div class="band">${tag("המניה", "var(--c-stock)")}<b class="say" style="margin:0">100 ₪ לפני שנתיים שווים היום ${Math.round(endP)} ₪${L.index ? `. בממוצע השוק: ${Math.round(endM)} ₪` : ""}.</b>
    <div class="chips">${chip("index", "ממוצע השוק", "var(--c-next)")}${chip("why", "קפיצות ולמה", "var(--c-news)")}${n.pulse && n.pulse.rev ? chip("sales", "מכירות", "var(--c-value)") : ""}${chip("events", "אירועים בשרשרת", "var(--c-chain)")}${chip("changes", "שינויים בתחום", "var(--c-news)")}${chip("next", "שנה קדימה", "var(--muted)")}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="מחיר המניה בשנתיים, 100 בתחילת התקופה">${g}</svg>${html}<div class="yrs">${yr}</div></div>${sales}
    ${L.changes ? `<div class="small">${M.changes.filter(c => c[2] === n.tier && /^\d{4}-\d{2}/.test(c[5]) && c[5] >= dates[0].slice(0, 7)).slice(0, 4).map((c, k) => `<b>${"אבגד"[k]}</b> ${esc(c[3])} (${hd(c[5].slice(0, 7))})`).join(" · ")}</div>` : ""}
    ${L.why ? `<span class="small">המספרים על הקו הם הימים שבהם המחיר זז הכי חזק. ההסבר לכל אחד ברשימה למטה.</span>` : ""}</div>`; }

/* ---------- why it moved ---------- */
function whyList(n) { const ms = (n.why || []).map((m, k) => ({ ...m, k: k + 1 })).reverse();
  if (!ms.length) return "";
  const cnt = {}; ms.forEach(m => { const k = m.kind || "unknown"; cnt[k] = (cnt[k] || 0) + 1; });
  const parts = Object.entries(cnt).filter(([k]) => k !== "unknown").map(([k, v]) => `${v} ${k === "report" ? "סביב דוח" : k === "news" ? "עם כותרות מאותו יום" : k === "event" ? "באירוע בשרשרת" : k === "analyst" ? "אחרי המלצת אנליסט" : k === "deal" ? "סביב עסקה" : "סביב רגולציה"}`);
  const searched = ms.some(m => m.searched);
  const card = m => { const key = n.id + m.date, sum = S.sums[key];
    const ev = m.event ? `<span>באותו יום: ${esc(m.event.name)}. ${m.event.linked ? "החברה קשורה לאירוע." : "אבל החברה לא קשורה אליו, ייתכן שזה צירוף מקרים."}</span>` : "";
    return `<div class="why ${m.kind ? "" : "unk"}" id="why-${m.k}"><div class="wh"><span class="wn" style="background:${m.kind ? WHYK[m.kind][1] : "var(--surface)"}">${m.k}</span><time>${hd(m.date)}</time>${arrowTxt(m.ret)}<span class="small">ביום אחד. המדד: <span class="num">${m.index > 0 ? "+" : ""}${m.index}%</span></span></div>
      <b>${m.earnings ? "יום הדוח הרבעוני של החברה." : m.kind ? WHYK[m.kind][0] : m.searched ? "לא מצאנו סיבה." : "עוד לא חיפשנו חדשות לחברה הזאת."}</b>${ev}
      ${(m.news || []).slice(0, 3).map(h => `<span class="raw">${esc(h.t)}</span><span class="small">${esc(h.src)} · <a href="${esc(safe(h.u))}" target="_blank" rel="noopener noreferrer">לידיעה המקורית</a></span>`).join("")}
      ${m.news && m.news.length ? (sum ? `<div class="sum">${esc(sum)}<span class="small"> · סיכום שנכתב בבינה מלאכותית מהכותרות. כדאי לקרוא את המקור.</span></div>` : `<button class="linkbtn" data-sum="${key}">לסכם בעברית</button>`) : ""}</div>`; };
  const shown = S.whyAll ? ms : ms.slice(0, 4);
  return `<div class="band tint-news" id="whyband">${tag("למה המחיר זז", "var(--c-news)")}
    <b class="say" style="margin:0">ב-${ms.length} הימים שבהם המחיר זז הכי חזק: ${parts.join(", ") || "אין הסבר מתועד"}${cnt.unknown ? `, ו-${cnt.unknown} בלי סיבה שמצאנו` : ""}.</b>
    ${shown.map(card).join("")}${ms.length > shown.length ? `<button class="pillbtn" data-whyall="1" style="align-self:flex-start">עוד ${ms.length - shown.length} ימים</button>` : ""}
    <span class="small">${searched ? "איך קובעים: תאריך הדוח הרשמי, אירועים שמיפינו, וכותרות שפורסמו ביום שלפני או ביום עצמו. כותרת מאותו יום לא בהכרח היא הסיבה. אנחנו לא ממציאים סיבה." : "עוד לא חיפשנו חדשות לחברה הזאת. החיפוש נעשה קודם לחברות הגדולות."}</span></div>`; }

/* ---------- the company card ---------- */
function storyCard(n) { const s = n.story, i = n.info;
  const src = ids => (ids || []).map(k => s && s.sources && s.sources[k] ? `<a href="${esc(safe(s.sources[k][1]))}" target="_blank" rel="noopener noreferrer" title="${esc(s.sources[k][0])}">${esc(k)}</a>` : "").filter(Boolean).join(" ");
  const holders = (n.holders || []).some(h => h.p > 50) ? "" : (n.holders || []).slice(0, 3).map(h => `<div class="kv"><span>${esc(h.n)}</span><b class="num">${h.p}%</b></div>`).join("");
  const insiders = i.heldPercentInsiders != null ? `<div class="kv"><span>המנהלים והדירקטורים, ביחד</span><b class="num">${(i.heldPercentInsiders * 100).toFixed(1)}%</b></div>` : "";
  if (!s) return `<div class="band tint-chain">${tag("הכרטיס של החברה", "var(--c-chain)")}<span>עוד לא חקרנו את הסיפור של ${esc(n.name)}. בינתיים, מה שידוע מהנתונים:</span>
      <div class="grid2"><div class="box"><span class="small">איפה</span><b>${esc(i.city || "")}${i.country ? ", " + esc(i.country) : ""}</b></div><div class="box"><span class="small">עובדים</span><b class="num">${i.fullTimeEmployees ? i.fullTimeEmployees.toLocaleString("en-US") : "–"}</b></div></div>
      ${n.people.length ? `<b>מי מנהל</b>${n.people.slice(0, 4).map(p => `<div class="kv"><span>${esc(p.n)}</span><span class="small">${esc(p.t)}</span></div>`).join("")}` : ""}
      ${holders ? `<b>מי מחזיק</b>${holders}${insiders}` : ""}<span class="small">מקור: Yahoo Finance.</span></div>`;
  return `<div class="band tint-chain">${tag("הכרטיס של החברה", "var(--c-chain)")}
    <div class="grid2"><div class="box"><span class="small">המטה</span><b>${esc(s.hq ? s.hq.city + ", " + s.hq.country : "")}</b></div>
      <div class="box"><span class="small">נוסדה</span><b class="num">${s.founded || "–"}</b></div>
      <div class="box"><span class="small">עובדים</span><b class="num">${s.employees ? Number(s.employees.value).toLocaleString("en-US") : (i.fullTimeEmployees || "–").toLocaleString("en-US")}</b></div>
      <div class="box"><span class="small">מפעלים ואתרים</span><b style="font-size:13.5px">${esc(n.sites || "–")}</b></div></div>
    ${s.timeline && s.timeline.length ? `<b>הסיפור</b><div class="tl">${s.timeline.map(t => `<div><b class="num">${t[0]}</b><span>${esc(t[1])} <sup>${src(t[2])}</sup></span></div>`).join("")}</div>` : ""}
    ${s.founders && s.founders.length ? `<b>המייסדים</b>${s.founders.map(f => `<div class="kv2"><b>${esc(f.name)}</b><span>${esc(f.story || "")} <sup>${src(f.src)}</sup></span></div>`).join("")}` : ""}
    ${s.leaders && s.leaders.length ? `<b>מי מנהל</b>${s.leaders.map(l => `<div class="kv2"><b>${esc(l.name)}</b><span>${esc(l.role || "")}${l.since ? `, מאז ${l.since}` : ""}${l.background ? `. ${esc(l.background)}` : ""} <sup>${src(l.src)}</sup></span></div>`).join("")}` : ""}
    <b>של מי החברה</b>${s.owners ? `<span>${esc(s.owners.text)} <sup>${src(s.owners.src)}</sup></span>` : ""}${holders}${insiders}
    ${s.governance && s.governance.length ? `<b>שימו לב</b>${s.governance.map(g => `<span>• ${esc(g.text)} <sup>${src(g.src)}</sup></span>`).join("")}` : ""}
    <b>איך עובדים שם</b>${s.approach ? `<span>${esc(s.approach.text)} <sup>${src(s.approach.src)}</sup></span>` : `<span class="dash">עוד אין לנו מקור אמין לזה.</span>`}
    ${s.how_to_start ? `<b>איך להתחיל להבין אותה</b><ol class="steps3">${s.how_to_start.map(h => `<li>${esc(h)}</li>`).join("")}</ol>` : ""}
    <details><summary>מקורות${s.unverified && s.unverified.length ? " ומה עוד לא אומת" : ""}</summary><div class="small">${Object.entries(s.sources || {}).map(([k, v]) => `<div><b>${esc(k)}</b> · <a href="${esc(safe(v[1]))}" target="_blank" rel="noopener noreferrer">${esc(v[0])}</a></div>`).join("")}
      ${s.unverified && s.unverified.length ? `<b>עוד לא אומת:</b>${s.unverified.map(u => `<div>• ${esc(u)}</div>`).join("")}` : ""}<div>נבדק ב-${hd(s.checked)}</div></div></details></div>`; }

/* ---------- who works with whom ---------- */
function netMap(n) { const sup = D.edges.filter(e => e.t === n.id).sort(byW), cus = D.edges.filter(e => e.s === n.id).sort(byW);
  const riv = D.nodes.filter(x => x.segment === n.segment && x.id !== n.id).slice(0, 4);
  const node = (id, sub, strong) => { const x = byId[id]; if (!x) return ""; const c = x.heat ? HEATC[x.heat.level] : "var(--soft)";
    return `<button class="nn ${strong ? "strong" : ""}" data-co="${id}" style="background:${c}"><b>${esc(x.name)}</b><span>${esc(sub || "")}</span><span>${x.heat ? x.heat.level_he + " · " + x.heat.heat : ""}</span></button>`; };
  const crit = sup.find(e => e.crit), bigc = cus.find(e => e.material);
  const bl = [crit ? `אם ${esc(byId[crit.s].name)} נתקעת, ${esc(n.name)} מרגישה ראשונה: היא תלויה בה מאוד.` : sup.length ? `${esc(n.name)} קונה מ-${sup.length} ספקים במפה, ואף אחד מהם לא סומן כתלות גדולה.` : "",
    bigc ? `${esc(byId[bigc.t].name)} היא לקוחה גדולה במיוחד: ${bigc.share ? `כ-${esc(bigc.share)}% מהמכירות של ${esc(n.name)}` : "תלות גדולה"}.` : cus.length ? `היא מוכרת ל-${cus.length} חברות במפה.` : "",
    riv.length ? `המתחרות הקרובות: ${riv.map(r => esc(r.name)).join(", ")}.` : ""].filter(Boolean).join(" ");
  return `<div class="band tint-chain">${tag("מי עובד עם מי", "var(--c-chain)")}<span class="small">הסחורה זורמת מימין לשמאל. הצבע של כל חברה הוא כמה היא חמה עכשיו. מסגרת עבה: תלות גדולה.</span>
    <div class="net"><div class="col"><span class="small">מוכרות לה</span>${sup.slice(0, 6).map(e => node(e.s, e.what, e.material)).join("") || '<span class="small">לא מיפינו</span>'}</div>
      <span class="to">←</span><div class="col mid">${node(n.id, D.stages[n.tier].title, true)}</div><span class="to">←</span>
      <div class="col"><span class="small">קונות ממנה</span>${cus.slice(0, 6).map(e => node(e.t, e.what, e.material)).join("") || '<span class="small">לא מיפינו</span>'}</div></div>
    ${riv.length ? `<div><span class="small">מתחרות באותו מוצר</span><div class="more">${riv.map(r => node(r.id, "", false)).join("")}</div></div>` : ""}
    ${bl ? `<div class="bottom"><b>השורה התחתונה</b><span>${bl}</span></div>` : ""}</div>`; }

/* ---------- the market as a heat map ---------- */
function heatPage() { const H = D.heat || {}, B = H.bottom || {};
  const order = D.tiers.filter(t => D.nodes.some(x => x.tier === t && x.heat));
  const capMax = Math.max(...D.nodes.map(x => (x.heat && x.heat.cap) || 0));
  const tile = x => { const w = Math.round(96 + Math.sqrt((x.heat.cap || 0) / capMax) * 120);
    return `<button class="ht" data-co="${x.id}" style="background:${HEATC[x.heat.level]};flex-basis:${w}px"><b>${esc(x.name)}</b><span>${x.heat.level_he} · ${x.heat.heat}</span></button>`; };
  $("page").innerHTML = `<div><span class="kicker">${esc(M.name)} · נכון ל-<span class="num">${hd(H.as_of)}</span></span><h1>מי חם עכשיו</h1></div>
    <div class="band tint-stock"><span class="tag" style="background:var(--surface);color:var(--ink)">השורה התחתונה</span><b class="say" style="margin:0">${esc(B.count || "")} חם זה לא סימן לקנות.</b>
      <span>${esc((B.not_buy || "").replace(/^חם זה לא סימן לקנות\. /, ""))}</span><span>${esc(B.where || "")}</span><div class="box">${esc(B.check || "")}</div></div>
    ${order.map(t => { const xs = D.nodes.filter(x => x.tier === t && x.heat).sort((a, b) => b.heat.heat - a.heat.heat);
      return `<div class="band"><div class="hrow"><b>${esc(D.stages[t].title)}</b><span class="small">חום חציוני: ${H.stage_heat ? H.stage_heat[t] : ""}</span></div><div class="hmap">${xs.map(tile).join("")}</div></div>`; }).join("")}
    <div class="band"><div class="hrow"><span>קפואה</span><div class="hscale" style="flex:1">${HEATS.map(([k]) => `<span style="background:${HEATC[k]}"></span>`).join("")}</div><span>רותחת</span></div>
      <span class="small">${esc(H.method || "")} גודל הריבוע: שווי החברה בבורסה.</span></div>`; }


/* ---------- what happened, as a four-step strip ---------- */
function eventPage() { const e = D.events.find(x => x.id === S.ev), [name, text] = evName(e.id);
  const grp = r => D.nodes.filter(n => roleOf(n, e.id) === r), hit = grp("hit"), cus = grp("down1"), rest = grp("control");
  const a = (ns, k) => mean(ns.map(n => n.ev[e.id][k])), top = ns => [...ns].sort((x, y) => x.ev[e.id].d3 - y.ev[e.id].d3).slice(0, 3).map(n => `<button class="pillbtn" data-co="${n.id}">${esc(n.name)}</button>`).join(" ");
  const bar = (label, v) => v == null ? "" : `<span>${label}</span><div class="t"><i style="${v < 0 ? `right:33.4%;width:${Math.min(66, -v / 12 * 66.6)}%;background:var(--down)` : `left:66.6%;width:${Math.min(33, v / 6 * 33.4)}%;background:var(--up)`}"></i></div><b>${sg(v, 1)}</b>`;
  const b = D.base, dots = x => x ? `<div class="dots">${Array.from({ length: x.n }, (_, k) => `<i class="${k < x.fell ? "on" : "off"}"></i>`).join("")}</div>` : "";
  const back = v => v == null ? "" : v > -0.5 ? "המחיר חזר למה שהיה לפני" : "המחיר עדיין נמוך ממה שהיה לפני";
  $("page").innerHTML = `
    <div><span class="kicker">מה קרה · <span class="num">${hd(e.ts.slice(0, 10))}</span></span><h1>${esc(name)}</h1></div><p class="lead">${esc(text)}</p>
    <div class="band"><h2>מה קרה, צעד אחר צעד</h2><div class="steps">
      <div class="step"><span class="n">1</span><b>האירוע</b><small>${esc(e.loc)}</small><small><a href="${esc(safe(e.url))}" target="_blank" rel="noopener noreferrer">לידיעה המקורית</a></small></div>
      <div class="step"><span class="n">2</span><b>החברות שנפגעו</b><span class="big">${hit.length ? sg(a(hit, "d3"), 1) : "–"}</span><small>${hit.length} חברות. כך זזה המניה שלהן בממוצע בשלושת הימים שאחרי</small><div>${top(hit)}</div></div>
      <div class="step"><span class="n">3</span><b>מי שקונה מהן</b><span class="big">${cus.length ? sg(a(cus, "d3"), 1) : "–"}</span><small>${cus.length ? `${cus.length} חברות שצריכות את מה שהנפגעות מייצרות` : "לא מצאנו חברות שתלויות בהן"}</small><div>${top(cus)}</div></div>
      <div class="step"><span class="n">4</span><b>שבועיים אחר כך</b><small>החברות שנפגעו: ${hit.length ? sg(a(hit, "d10"), 1) : "–"}. ${back(hit.length ? a(hit, "d10") : null)}</small><small>${cus.length ? `מי שקונה מהן: ${sg(a(cus, "d10"), 1)}. ${back(a(cus, "d10"))}` : ""}</small></div></div></div>
    <div class="band"><h2>מי נפגע הכי הרבה?</h2><div class="bars">${bar("החברות שנפגעו", hit.length ? a(hit, "d3") : null)}${bar("מי שקונה מהן", cus.length ? a(cus, "d3") : null)}${bar("שאר החברות בתחום", rest.length ? a(rest, "d3") : null)}</div>
      <span class="muted" style="font-size:13px">הקו הדק הוא אפס. פס אדום שמאלה: המניה ירדה. פס ירוק ימינה: עלתה. מדובר בשלושת הימים שאחרי האירוע.</span></div>
    <div class="band"><h2>זה קורה כל פעם?</h2>
      ${b.hit ? `<p class="say">בעבר, החברות שנפגעו ירדו ב-${b.hit.fell} מתוך ${b.hit.n} אירועים דומים.</p>${dots(b.hit)}` : ""}${b.down1 ? `<p class="say">מי שקונה מהן ירד ב-${b.down1.fell} מתוך ${b.down1.n} אירועים.</p>${dots(b.down1)}` : ""}
      <span class="muted" style="font-size:13px">כל עיגול הוא אירוע אחד. עיגול מלא: המניה ירדה. אלה מעט אירועים, אז זה רמז ולא חוק.</span></div>
    <div class="band"><h2>עוד אירועים שבדקנו</h2><div class="more">${D.events.filter(x => x.id !== e.id).map(x => `<button class="pillbtn" data-ev="${x.id}">${esc(evName(x.id)[0])} <span class="num muted">${x.ts.slice(0, 4)}</span></button>`).join("")}</div></div>`; }

/* ---------- portfolio builder ---------- */
function buildPage() { const dd = o => Math.round((Math.exp(o.max_drawdown / 100) - 1) * 100); const B = D.baskets; if (!B) { $("page").innerHTML = '<p class="lead">עוד אין נתונים לבניית תיק בשוק הזה.</p>'; return; }
  const b = B[S.level], pop = B.popular, ev = Object.values(b.events_r3), fell = ev.filter(x => x < 0).length, pev = Object.values(pop.events_r3);
  const top = o => { const [c, k] = Object.entries(o.countries).sort((x, y) => y[1] - x[1])[0]; return [c, k]; };
  const cmp = (label, mine, theirs, unit, max) => `<span>${label}</span><div class="t2"><i style="width:${Math.min(100, Math.abs(mine) / max * 100)}%;background:var(--ink)"></i><i style="width:${Math.min(100, Math.abs(theirs) / max * 100)}%;background:var(--muted);opacity:.5"></i></div><b class="num">${mine}${unit} <span class="muted" style="font-weight:400">מול ${theirs}${unit}</span></b>`;
  $("page").innerHTML = `
    <div><span class="kicker">בונה תיק · ${esc(M.name)}</span><h1>לא לשים את כל הביצים בסל אחד</h1></div>
    <p class="lead">תיק הוא כמה מניות שקונים יחד. כאן בחרנו חברה אחת מכל שלב בשרשרת, מכמה מדינות. ככה, אם משהו רע קורה במקום אחד, לא כל התיק נפגע.</p>
    <div class="switch" style="align-self:flex-start"><button data-level="calm" aria-selected="${S.level === "calm"}">רגוע יותר</button><button data-level="bold" aria-selected="${S.level === "bold"}">נועז יותר</button></div>
