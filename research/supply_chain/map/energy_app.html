function pickPanel(n) { if (!S.pick) return `<div class="side"><b>מה מסומן על הגרף</b><p class="muted">עיגול כתום הוא אירוע עבר. מעוין כחול הוא שינוי ברגולציה, בטכנולוגיה או מהלך עסקי. לחיצה על סימן מציגה כאן הסבר וקישור למקור.</p></div>`;

  const c = M.changes[Number(id)];

    <p class="muted">השלב המושפע: ${esc(stage(c[2]))}. מצב: ${esc(c[6])}.</p><div>${src(c[7])}</div></div>`; }
function mini(n, sup, cus) { const cap = 5, A = sup.slice(0, cap), C = cus.slice(0, cap), rows = Math.max(A.length, C.length, 1), H = 44 + rows * 30, W = 540, bw = 146, bh = 22;
  const y = (i, k) => 34 + (rows - k) * 15 + i * 30, cy = H / 2 + 6, mx = (W - bw) / 2;
  const box = (x, yy, o, cls) => `<g ${o ? `data-go="${o.id}"` : ""} class="${cls || ""}"><rect x="${x}" y="${yy}" width="${bw}" height="${bh}" rx="6"/><text x="${x + bw / 2}" y="${yy + 15}" text-anchor="middle">${esc((o || n).name.slice(0, 19))}</text></g>`;
  const ln = (x1, y1, x2, y2, m) => `<path d="M${x1} ${y1}C${(x1 + x2) / 2} ${y1},${(x1 + x2) / 2} ${y2},${x2} ${y2}" stroke-width="${m ? 2.4 : 1}"/>`;
  return `<div class="mini"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ספקים ולקוחות"><text class="cap" x="${W - 10 - bw / 2}" y="18" text-anchor="middle" direction="rtl">מי מספק לה${sup.length > cap ? ` (${cap} מתוך ${sup.length})` : ""}</text>
    <text class="cap" x="${10 + bw / 2}" y="18" text-anchor="middle" direction="rtl">למי היא מוכרת${cus.length > cap ? ` (${cap} מתוך ${cus.length})` : ""}</text>
    ${A.map((e, i) => ln(W - 10 - bw, y(i, A.length) + bh / 2, mx + bw, cy, e.material)).join("")}${C.map((e, i) => ln(mx, cy, 10 + bw, y(i, C.length) + bh / 2, e.material)).join("")}
    ${A.map((e, i) => box(W - 10 - bw, y(i, A.length), byId[e.s])).join("")}${C.map((e, i) => box(10, y(i, C.length), byId[e.t])).join("")}${box(mx, cy - bh / 2, null, "me")}</svg></div>`; }
function newsItem(x) { return `<li>${x.he ? `<span>${esc(x.he)} ${tag("סיכום: בינה מלאכותית")}</span>` : x.s ? `<span class="raw" style="font-size:13.5px;color:var(--fg)">${esc(x.s)}</span><span class="lbl">תקציר המקור, באנגלית</span>` : ""}
  <span class="raw">${esc(x.t)}</span><span class="lbl">${esc(x.p)} · <span class="num">${esc(x.d)}</span> · <a href="${esc(x.u)}" target="_blank" rel="noopener">לידיעה המלאה</a></span></li>`; }
function company() { const n = byId[S.co], i = n.info, p = n.pulse || {};
  const sup = D.edges.filter(e => e.t === n.id).sort(byWeight), cus = D.edges.filter(e => e.s === n.id).sort(byWeight);
  const evs = D.events.filter(e => n.ev[e.id] && (n.ev[e.id].w || n.ev[e.id].role) !== "control");
  const y1 = chg(n.px, 52), last = n.px.filter(x => x != null).pop();
  const names = (es, f) => es.slice(0, 2).map(e => byId[f(e)].name).join(" ו-");
  const sentence = `${n.name} פועלת בשלב "${stage(n.tier)}": ${M.plain[n.tier].replace(/\.$/, "")}. ` + (cus.length ? `בין הלקוחות שלה: ${names(cus, e => e.t)}. ` : "") + (sup.length ? `בין הספקים שלה: ${names(sup, e => e.s)}.` : "");
  const link = (e, o) => `<li><div>${co(o)} ${e.material ? tag("קשר מהותי") : ""} ${e.share ? `<span class="num">${e.share}%</span> <span class="lbl">מהכנסות הספק</span>` : ""}</div>
    <span class="lbl">${esc(e.what)}${e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">מקור</a>` : ""}</span></li>`;
  const tabs = [["overview", "סקירה"], ["chain", `שרשרת (${sup.length + cus.length})`], ["money", "כספים"], ["news", `חדשות (${n.news.length})`], ["events", `אירועים (${evs.length})`]];
  const chartCard = `<div class="card"><div class="head"><h2>המניה לאורך זמן</h2><div class="chips">
      ${[[52, "שנה"], [156, "3 שנים"], [263, "5 שנים"]].map(r => `<button class="chip" data-range="${r[0]}" aria-pressed="${S.range === r[0]}">${r[1]}</button>`).join("")}</div></div>
    <div class="chips"><span class="lbl">שכבות:</span>
      <button class="chip" data-layer="market" aria-pressed="${S.layers.market}"><i style="background:var(--muted)"></i>${esc(M.index_name)}</button>
      <button class="chip" data-layer="events" aria-pressed="${S.layers.events}"><i style="background:var(--warn)"></i>אירועים</button>

    <div class="chart">${chart(n)}</div>
    <span class="lbl">הקו מראה בכמה אחוזים השתנה המחיר מתחילת התקופה. ${p.rev ? `העמודות למטה: הכנסות ${p.rev_unit ? "חודשיות" : "רבעוניות"}.` : ""}</span></div>`;
  let body = "";
  if (S.tab === "overview") body = `<div class="grid split">${chartCard}<div class="grid" style="align-content:start">${pickPanel(n)}
      <div class="card"><h2>מספרים עיקריים</h2><div class="stats"><div><span class="lbl">הכנסות בשנה</span><b class="num">${usd(i.revenueUSD)}</b></div><div><span class="lbl">רווח נקי</span><b class="num">${usd(i.netIncomeUSD)}</b></div>
        <div><span class="lbl">עובדים</span><b class="num">${i.fullTimeEmployees ? i.fullTimeEmployees.toLocaleString("en") : "–"}</b></div><div><span class="lbl">שווי שוק</span><b class="num">${usd(i.marketCapUSD)}</b></div>
        <div><span class="lbl">רווח גולמי</span><b class="num">${f1(i.grossMargins, 100, "%")}</b></div><div><span class="lbl">צמיחת הכנסות</span><b class="num">${f1(i.revenueGrowth, 100, "%")}</b></div></div></div></div></div>
    <div class="grid split"><div class="card"><div class="head"><h2>מי מספק לה ולמי היא מוכרת</h2><button class="more" data-tab="chain">לכל הקשרים</button></div>${sup.length + cus.length ? mini(n, sup, cus) : '<p class="muted">לא נמצאו קשרים מתועדים.</p>'}</div>
      <div class="card"><div class="head"><h2>חדשות אחרונות</h2><button class="more" data-tab="news">עוד ${Math.max(0, n.news.length - 2)}</button></div><ul class="items">${n.news.slice(0, 2).map(newsItem).join("") || '<li class="muted">אין ידיעות.</li>'}</ul></div></div>`;
  if (S.tab === "chain") body = `<div class="card">${sup.length + cus.length ? mini(n, sup, cus) : ""}<span class="lbl">קו עבה הוא קשר מהותי. לחיצה על חברה עוברת אליה.</span>
    <div class="two"><div><h2 style="margin-bottom:8px">למי היא מוכרת</h2><ul class="items">${cus.map(e => link(e, e.t)).join("") || '<li class="muted">לא נמצאו</li>'}</ul></div>
      <div><h2 style="margin-bottom:8px">מי מספק לה</h2><ul class="items">${sup.map(e => link(e, e.s)).join("") || '<li class="muted">לא נמצאו</li>'}</ul></div></div></div>`;
  if (S.tab === "money") { const kv = [["מכפיל רווח", f1(i.trailingPE)], ["רווח תפעולי", f1(i.operatingMargins, 100, "%")], ["ימי מלאי", p.inventory_days ? p.inventory_days.latest : "–"],
      ["התחייבויות רכש לספקים", p.purchase_obligation ? usd(p.purchase_obligation.value) : "–"], ["התחייבויות של לקוחות", p.remaining_performance_obligation ? usd(p.remaining_performance_obligation.value) : "–"], ["מקדמות מלקוחות", p.customer_prepayments ? usd(p.customer_prepayments.value) : "–"]];
    const s = p.seasonality, v = s && ["Q1", "Q2", "Q3", "Q4"].map(q => s[q]), lo = v && Math.min(...v, 90) - 4, hi = v && Math.max(...v, 110);

/* ================= screen 3: case ================= */
function caseScreen() { const e = D.events.find(x => x.id === S.ev), h = histOf(e.id), hide = S.practice && !S.guessed;
  const of = role => D.nodes.filter(n => n.ev[e.id] && (n.ev[e.id].w || n.ev[e.id].role) === role);
  const why = (n, role) => { if (role === "hit") return "המפעלים או האספקה שלה נפגעו ישירות";
    const x = role === "down1" ? D.edges.find(g => g.t === n.id && e.hit.includes(g.s) && g.crit) : D.edges.find(g => g.s === n.id && e.hit.includes(g.t) && Number(g.share) >= 10);
    return !x ? "" : role === "down1" ? `קונה מ-${byId[x.s].name}: ${x.what}` : `${x.share}% מההכנסות שלה מגיעים מ-${byId[x.t].name}`; };
  const groups = ["hit", "down1", "up1"].map(role => { const ns = of(role).sort((a, b) => a.ev[e.id].d3 - b.ev[e.id].d3); if (!ns.length) return "";
    return `<tr><th colspan="4" style="padding-top:14px;color:var(--fg);font-size:13.5px">${L.roles[role]} (${ns.length})</th></tr>` + ns.map(n => { const r = n.ev[e.id];
      return `<tr><td>${co(n.id)}</td><td class="muted">${esc(why(n, role))}</td><td class="r">${hide ? "?" : pct(r.d3)}</td><td class="r">${hide ? "?" : pct(r.d10)}</td></tr>`; }).join(""); }).join("");
  const lo = -12, hi = 6, P = v => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * 100;
  const base = ["hit", "down1", "up1"].filter(r => D.base[r] && D.base[r].n >= 2).map(r => { const b = D.base[r], t = b.by_event[e.id];
    return `<tr><td>${L.roles[r]}</td><td class="r">ירדו ב-<b>${b.fell}</b> מתוך <b>${b.n}</b> אירועים</td><td class="r">${pct(b.mean)}</td>
      <td><div class="range"><div class="axis"></div><div class="band" style="left:${P(b.min)}%;width:${P(b.max) - P(b.min)}%"></div><div class="zero" style="left:${P(0)}%"></div><div class="dot" style="left:${P(b.mean)}%"></div>${t != null && !hide ? `<div class="this" style="left:${P(t)}%"></div>` : ""}</div></td>

    ${S.guessed ? `<p><b>${(S.guessed === "down") === (mine < -0.5) || (S.guessed === "flat" && Math.abs(mine) <= 0.5) || (S.guessed === "up" && mine > 0.5) ? "קלעת." : "לא הפעם."}</b> בממוצע הן זזו ${pct(mine)}. הפירוט המלא מופיע עכשיו למטה.</p>`
      : `<div class="guess"><button class="btn" data-guess="down">ירדו</button><button class="btn" data-guess="flat">כמעט לא זזו</button><button class="btn" data-guess="up">עלו</button></div>`}</div>` : "";
  $("screen").innerHTML = `<div class="card"><div class="head"><div><span class="lbl">תיק אירוע · <span class="num">${e.ts.slice(0, 10)}</span> · ${esc(e.loc)}</span><h1>${esc(h ? h[1] : e.name)}</h1></div>
      <button class="btn" data-practice>${S.practice ? "יציאה ממצב תרגול" : "מצב תרגול: להסתיר את התוצאות"}</button></div>
      <p class="intro">${esc(h ? h[2] : e.note)}</p><span class="lbl"><a href="${esc(e.url)}" target="_blank" rel="noopener">למקור</a>${e.confounder ? ` · באותם ימים קרה גם: ${esc(e.confounder)}` : ""}</span></div>
    ${guess}
    <div class="card"><div class="head"><h2>מי חשוף, ולמה</h2><span class="lbl">התנועה היא אחרי ניכוי השוק המקומי</span></div><div class="scroll"><table><thead><tr><th>חברה</th><th>למה היא חשופה</th><th class="r">אחרי 3 ימים</th><th class="r">אחרי 10 ימים</th></tr></thead><tbody>${groups}</tbody></table></div></div>
    <div class="card"><div class="head"><h2>מה קרה במקרים דומים בעבר</h2><span class="lbl">תנועה ממוצעת אחרי 3 ימים. הפס: הטווח בין האירועים. ${hide ? "" : "הקו השחור: האירוע הזה."}</span></div>

      <div class="card"><h2>נגד: למה להיזהר</h2><ul class="plain"><li>המדגם קטן: ${d1 ? d1.n : "מעט"} אירועים בלבד, ואירוע אחד יכול להטות את הממוצע.</li>
        <li>ההגדרה של "לקוח תלוי" נקבעה אחרי שנראו התוצאות הראשונות.</li>${hb ? `<li>אצל הנפגעות הישירות רוב הירידה נמחקת: אחרי 10 ימים הממוצע הוא ${hb.d10}%.</li>` : ""}${e.confounder ? `<li>באירוע הזה קרה במקביל: ${esc(e.confounder)}.</li>` : ""}</ul></div></div>
    <div class="card"><h2>מה יפריך את זה</h2><ul class="plain"><li>הודעה של החברה שהייצור חזר לפעול בתוך יום או יומיים.</li><li>ללקוח יש ספק חלופי או מלאי שמספיק לכמה חודשים.</li><li>באירועים הבאים שנאסוף, הלקוחות התלויים לא יורדים יותר משאר השוק.</li></ul></div>
    <div class="card"><h2>שורה תחתונה</h2><p class="bottom">${d1 ? `באירועים דומים, מניות של לקוחות תלויים ירדו בממוצע ${Math.abs(d1.mean)}% בשלושה ימים, ב-${d1.fell} מתוך ${d1.n} מקרים.` : "אין מספיק מקרים דומים כדי לומר משהו."}</p>
      <span class="lbl">זה נתון היסטורי ממדגם קטן, לא תחזית ולא המלצה. היומן שיבדוק תחזיות לאורך זמן עוד לא התחיל.</span></div>`;
}

/* ================= shell ================= */
